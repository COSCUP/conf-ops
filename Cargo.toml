[workspace]
members = [".", "xtask"]
resolver = "2"

[package]
name = "conf-ops"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_const_for_fn = "allow"
unused_async = "allow"

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7", "serde"] }
jsonwebtoken = "9"
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }
webauthn-rs-proto = "0.5"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport"] }
mail-parser = "0.10"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
axum-extra = { version = "0.10", features = ["cookie", "typed-header"] }
async-trait = "0.1"
dashmap = "6"
url = "2"
time = "0.3.41"
utoipa = { version = "5", features = ["chrono", "uuid"] }
moka = { version = "0.12", features = ["future"] }
yrs = "0.21"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3"
postgresql_embedded = "0.20"
tokio-tungstenite = { version = "0.28.0", features = ["connect"] }
tower = { version = "0.5", features = ["util"] }
webauthn-authenticator-rs = "0.5"
