# Conf-Ops API - 專案成員相關 Schema 定義
# Project member schemas — responses, requests

# =============================================================================
# Member Response（專案成員回應）
# =============================================================================

MemberResponse:
  type: object
  description: "專案成員回應"
  required:
    - id
    - accountId
    - role
    - createdAt
  properties:
    id:
      $ref: "./common.yaml#/UUID"
    accountId:
      $ref: "./common.yaml#/UUID"
    name:
      type: string
      description: "成員名稱（來自帳號）"
    email:
      type: string
      format: email
      description: "成員 Email（來自帳號）"
    avatarUrl:
      type: string
      nullable: true
      description: "成員頭像 URL"
    bio:
      type: string
      nullable: true
      description: "公開的自我介紹文字"
    role:
      $ref: "./common.yaml#/MemberRole"
    tags:
      type: array
      items:
        type: object
        required:
          - id
          - name
        properties:
          id:
            $ref: "./common.yaml#/UUID"
          name:
            type: string
      description: "成員所屬的成員標籤"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

MemberDetailResponse:
  type: object
  description: "專案成員詳細回應，包含統計資訊"
  required:
    - id
    - accountId
    - role
    - createdAt
    - updatedAt
  properties:
    id:
      $ref: "./common.yaml#/UUID"
    accountId:
      $ref: "./common.yaml#/UUID"
    name:
      type: string
      description: "成員名稱（來自帳號）"
    email:
      type: string
      format: email
      description: "成員 Email（來自帳號）"
    avatarUrl:
      type: string
      nullable: true
      description: "成員頭像 URL"
    bio:
      type: string
      nullable: true
      description: "公開的自我介紹文字"
    role:
      $ref: "./common.yaml#/MemberRole"
    tags:
      type: array
      items:
        type: object
        required:
          - id
          - name
        properties:
          id:
            $ref: "./common.yaml#/UUID"
          name:
            type: string
          description:
            type: string
            nullable: true
      description: "成員所屬的成員標籤（含描述）"
    todoStats:
      type: object
      description: "成員的待辦事項統計"
      properties:
        open:
          type: integer
          description: "未完成的待辦事項數量"
        completed:
          type: integer
          description: "已完成的待辦事項數量"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

MemberListResponse:
  type: object
  description: "專案成員列表回應，含游標分頁"
  required:
    - items
    - meta
  properties:
    items:
      type: array
      items:
        $ref: "#/MemberResponse"
    meta:
      $ref: "./common.yaml#/CursorPaginationMeta"

# =============================================================================
# Member Request（專案成員請求）
# =============================================================================

InviteProjectMemberRequest:
  type: object
  description: "邀請成員加入專案請求"
  required:
    - accountId
    - role
  properties:
    accountId:
      $ref: "./common.yaml#/UUID"
      description: "被邀請者的帳號 ID（必須已是組織成員）"
    role:
      $ref: "./common.yaml#/MemberRole"
      description: "指定的專案角色"
    tagIds:
      type: array
      items:
        $ref: "./common.yaml#/UUID"
      description: "初始指派的成員標籤 ID 列表"

UpdateMemberRequest:
  type: object
  description: "更新專案成員角色請求"
  required:
    - role
  properties:
    role:
      $ref: "./common.yaml#/MemberRole"
      description: "新的專案角色"
