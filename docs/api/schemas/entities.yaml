# Conf-Ops API - 實體回應 Schema 定義
# 定義所有實體的完整回應與列表摘要回應結構

# =============================================================================
# Alias 定義（短名稱 → 完整 Response Schema）
# =============================================================================

Account:
  $ref: '#/AccountResponse'
Organization:
  $ref: '#/OrganizationResponse'
OrganizationMember:
  $ref: '#/OrganizationMemberResponse'
Project:
  $ref: '#/ProjectResponse'
Member:
  $ref: '#/MemberResponse'
Contact:
  $ref: '#/ContactResponse'
MemberTag:
  $ref: '#/MemberTagResponse'
TaskTemplate:
  $ref: '#/TaskTemplateResponse'
TodoTemplate:
  $ref: '#/TodoTemplateResponse'
DataSchema:
  $ref: '#/DataSchemaResponse'
Task:
  $ref: '#/TaskResponse'
Message:
  $ref: '#/MessageResponse'
SuggestionGroup:
  $ref: '#/SuggestionGroupResponse'
Suggestion:
  $ref: '#/SuggestionResponse'
Todo:
  $ref: '#/TodoResponse'
DataEntry:
  $ref: '#/DataEntryResponse'
ToolConfig:
  $ref: '#/ToolConfigResponse'
Memory:
  $ref: '#/MemoryResponse'
LibraryDocument:
  $ref: '#/LibraryDocumentResponse'
AuditLog:
  $ref: '#/AuditLogResponse'
Notification:
  $ref: '#/NotificationResponse'
Reminder:
  $ref: '#/ReminderResponse'
EmailThread:
  $ref: '#/EmailThreadResponse'
Webhook:
  $ref: '#/WebhookResponse'
WebhookEventLog:
  $ref: '#/WebhookEventLogResponse'

# =============================================================================
# Account（帳號）
# =============================================================================

AccountResponse:
  type: object
  description: "帳號完整回應"
  required:
    - id
    - name
    - email
    - locale
    - createdAt
    - updatedAt
  properties:
    id:
      $ref: "./common.yaml#/UUID"
    name:
      type: string
      description: "使用者名稱"
    email:
      type: string
      format: email
      description: "Email，系統唯一識別"
    avatarUrl:
      type: string
      nullable: true
      description: "頭像 URL"
    bio:
      type: string
      nullable: true
      description: "公開的自我介紹文字"
    profileData:
      type: object
      additionalProperties: true
      description: "私人的結構化資料（僅帳號本人可查看）"
    profileSchema:
      type: array
      items:
        $ref: "#/ProfileSchemaField"
      description: "個人欄位結構描述"
    notificationPreferences:
      $ref: "#/NotificationPreferences"
    locale:
      type: string
      description: "使用者偏好語系"
      examples:
        - "zh-TW"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

AccountSummary:
  type: object
  description: "帳號摘要（用於列表與關聯顯示）"
  required:
    - id
    - name
    - email
  properties:
    id:
      $ref: "./common.yaml#/UUID"
    name:
      type: string
    email:
      type: string
      format: email
    avatarUrl:
      type: string
      nullable: true

ProfileSchemaField:
  type: object
  description: "個人資料欄位結構描述"
  required:
    - key
    - label
    - description
    - type
  properties:
    key:
      type: string
      description: "欄位鍵名，對應 profileData 中的 key"
    label:
      type: string
      description: "欄位顯示名稱"
    description:
      type: string
      description: "欄位用途說明"
    type:
      type: string
      description: "欄位類型，前端據此渲染對應的輸入元件。建議值：text, number, email, url, date, select, multi_select, checkbox, file"

NotificationPreferences:
  type: object
  description: "通知偏好設定"
  properties:
    channels:
      type: object
      properties:
        email:
          $ref: "#/ChannelConfig"
        webPush:
          $ref: "#/ChannelConfig"
        inApp:
          $ref: "#/ChannelConfig"

ChannelConfig:
  type: object
  description: "通知頻道設定"
  properties:
    enabled:
      type: boolean
    categories:
      type: object
      properties:
        taskUpdates:
          type: boolean
        todoAssignments:
          type: boolean
        aiSuggestions:
          type: boolean
        mentions:
          type: boolean
        systemAnnouncements:
          type: boolean

# =============================================================================
# Organization（組織）
# =============================================================================

OrganizationResponse:
  type: object
  description: "組織完整回應"
  required:
    - id
    - name
    - createdBy
    - createdAt
    - updatedAt
  properties:
    id:
      $ref: "./common.yaml#/UUID"
    name:
      type: string
      description: "組織名稱"
    description:
      type: string
      nullable: true
      description: "組織描述"
    logoUrl:
      type: string
      nullable: true
      description: "組織 Logo URL"
    createdBy:
      $ref: "./common.yaml#/UUID"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

OrganizationSummary:
  type: object
  description: "組織摘要"
  required:
    - id
    - name
  properties:
    id:
      $ref: "./common.yaml#/UUID"
    name:
      type: string
    logoUrl:
      type: string
      nullable: true

# =============================================================================
# OrganizationMember（組織成員）
# =============================================================================

OrganizationMemberResponse:
  type: object
  description: "組織成員完整回應"
  required:
    - id
    - organizationId
    - accountId
    - role
    - createdAt
    - updatedAt
  properties:
    id:
      $ref: "./common.yaml#/UUID"
    organizationId:
      $ref: "./common.yaml#/UUID"
    accountId:
      $ref: "./common.yaml#/UUID"
    role:
      $ref: "./common.yaml#/OrgRole"
    account:
      $ref: "#/AccountSummary"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

# =============================================================================
# Project（專案）
# =============================================================================

ProjectResponse:
  type: object
  description: "專案完整回應"
  required:
    - id
    - organizationId
    - name
    - status
    - createdBy
    - createdAt
    - updatedAt
  properties:
    id:
      $ref: "./common.yaml#/UUID"
    organizationId:
      $ref: "./common.yaml#/UUID"
    name:
      type: string
      description: "專案名稱"
    description:
      type: string
      nullable: true
      description: "專案描述"
    status:
      $ref: "./common.yaml#/ProjectStatus"
    sourceProjectId:
      $ref: "./common.yaml#/UUID"
      nullable: true
      description: "來源專案 ID（若為複製建立）"
    permissionSettings:
      $ref: "#/PermissionSettings"
    createdBy:
      $ref: "./common.yaml#/UUID"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

ProjectSummary:
  type: object
  description: "專案摘要"
  required:
    - id
    - organizationId
    - name
    - status
  properties:
    id:
      $ref: "./common.yaml#/UUID"
    organizationId:
      $ref: "./common.yaml#/UUID"
    name:
      type: string
    status:
      $ref: "./common.yaml#/ProjectStatus"
    description:
      type: string
      nullable: true

PermissionSettings:
  type: object
  description: "專案權限設定"
  properties:
    taskVisibility:
      type: array
      items:
        $ref: "#/PermissionRule"
    toolPermissions:
      type: array
      items:
        $ref: "#/PermissionRule"
    memoryVisibility:
      type: array
      items:
        $ref: "#/PermissionRule"
    dataAccess:
      type: array
      items:
        $ref: "#/PermissionRule"

PermissionRule:
  type: object
  description: "權限規則"
  required:
    - tag
    - allow
    - deny
  properties:
    tag:
      type: string
      description: "成員標籤名稱，'*' 表示所有標籤"
    allow:
      type: array
      items:
        type: string
      description: "允許的權限項目"
    deny:
      type: array
      items:
        type: string
      description: "拒絕的權限項目"

# =============================================================================
# Member（專案成員）
# =============================================================================

MemberResponse:
  type: object
  description: "專案成員完整回應"
  required:
    - id
    - projectId
    - accountId
    - role
    - createdAt
    - updatedAt
  properties:
    id:
      $ref: "./common.yaml#/UUID"
    projectId:
      $ref: "./common.yaml#/UUID"
    accountId:
      $ref: "./common.yaml#/UUID"
    role:
      $ref: "./common.yaml#/MemberRole"
    account:
      $ref: "#/AccountSummary"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

MemberSummary:
  type: object
  description: "專案成員摘要"
  required:
    - id
    - accountId
    - role
  properties:
    id:
      $ref: "./common.yaml#/UUID"
    accountId:
      $ref: "./common.yaml#/UUID"
    role:
      $ref: "./common.yaml#/MemberRole"
    account:
      $ref: "#/AccountSummary"

# =============================================================================
# Contact（外部聯絡人）
# =============================================================================

ContactResponse:
  type: object
  description: "外部聯絡人完整回應"
  required:
    - id
    - organizationId
    - name
    - email
    - createdAt
    - updatedAt
  properties:
    id:
      $ref: "./common.yaml#/UUID"
    organizationId:
      $ref: "./common.yaml#/UUID"
    name:
      type: string
      description: "聯絡人名稱"
    email:
      type: string
      format: email
      description: "聯絡人 Email"
    mergedIntoId:
      $ref: "./common.yaml#/UUID"
      nullable: true
      description: "合併目標 Contact ID，null 表示未被合併"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

ContactSummary:
  type: object
  description: "外部聯絡人摘要"
  required:
    - id
    - name
    - email
  properties:
    id:
      $ref: "./common.yaml#/UUID"
    name:
      type: string
    email:
      type: string
      format: email

# =============================================================================
# MemberTag（成員標籤）
# =============================================================================

MemberTagResponse:
  type: object
  description: "成員標籤完整回應"
  required:
    - id
    - projectId
    - name
    - externalTaskCreation
    - createdAt
    - updatedAt
  properties:
    id:
      $ref: "./common.yaml#/UUID"
    projectId:
      $ref: "./common.yaml#/UUID"
    name:
      type: string
      description: "標籤名稱（如「贊助組」、「資訊組」）"
    description:
      type: string
      nullable: true
      description: "標籤描述"
    externalTaskCreation:
      type: array
      items:
        $ref: "#/ExternalTaskCreationRule"
      description: "外部建立任務設定"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

MemberTagSummary:
  type: object
  description: "成員標籤摘要"
  required:
    - id
    - name
  properties:
    id:
      $ref: "./common.yaml#/UUID"
    name:
      type: string

ExternalTaskCreationRule:
  type: object
  description: "跨組任務建立規則"
  required:
    - taskTemplateId
    - allowedFromTags
  properties:
    taskTemplateId:
      $ref: "./common.yaml#/UUID"
    allowedFromTags:
      oneOf:
        - type: string
          const: "*"
          description: "允許所有成員標籤"
        - type: array
          items:
            type: string
          description: "允許指定成員標籤名稱列表"

# =============================================================================
# MemberTagAssignment（成員標籤指派）
# =============================================================================

MemberTagAssignmentResponse:
  type: object
  description: "成員標籤指派回應"
  required:
    - id
    - tagId
    - projectId
    - createdAt
  properties:
    id:
      $ref: "./common.yaml#/UUID"
    tagId:
      $ref: "./common.yaml#/UUID"
    memberId:
      $ref: "./common.yaml#/UUID"
      nullable: true
      description: "被指派的成員 ID（與 contactId 二擇一）"
    contactId:
      $ref: "./common.yaml#/UUID"
      nullable: true
      description: "被指派的聯絡人 ID（與 memberId 二擇一）"
    projectId:
      $ref: "./common.yaml#/UUID"
    createdAt:
      type: string
      format: date-time

# =============================================================================
# TaskTemplate（任務模板）
# =============================================================================

TaskTemplateResponse:
  type: object
  description: "任務模板完整回應"
  required:
    - id
    - name
    - createdBy
    - createdAt
    - updatedAt
  properties:
    id:
      $ref: "./common.yaml#/UUID"
    name:
      type: string
      description: "模板名稱"
    description:
      type: string
      nullable: true
      description: "模板描述"
    createdBy:
      $ref: "./common.yaml#/UUID"
    tags:
      type: array
      items:
        $ref: "#/MemberTagSummary"
      description: "關聯的成員標籤"
    todoTemplates:
      type: array
      items:
        $ref: "#/TodoTemplateResponse"
      description: "待辦事項模板"
    dataSchemas:
      type: array
      items:
        $ref: "#/DataSchemaResponse"
      description: "資料表定義"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

TaskTemplateSummary:
  type: object
  description: "任務模板摘要"
  required:
    - id
    - name
  properties:
    id:
      $ref: "./common.yaml#/UUID"
    name:
      type: string
    description:
      type: string
      nullable: true

# =============================================================================
# TodoTemplate（待辦事項模板）
# =============================================================================

TodoTemplateResponse:
  type: object
  description: "待辦事項模板回應"
  required:
    - id
    - taskTemplateId
    - name
    - sortOrder
    - createdAt
    - updatedAt
  properties:
    id:
      $ref: "./common.yaml#/UUID"
    taskTemplateId:
      $ref: "./common.yaml#/UUID"
    parentId:
      $ref: "./common.yaml#/UUID"
      nullable: true
      description: "父待辦模板 ID，null 表示頂層"
    name:
      type: string
      description: "待辦模板名稱"
    description:
      type: string
      nullable: true
    sortOrder:
      type: integer
      description: "排序順序"
    children:
      type: array
      items:
        $ref: "#/TodoTemplateResponse"
      description: "子待辦模板（最多一層）"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

# =============================================================================
# DataSchema（資料表定義）
# =============================================================================

DataSchemaResponse:
  type: object
  description: "資料表定義回應"
  required:
    - id
    - taskTemplateId
    - name
    - fields
    - createdAt
    - updatedAt
  properties:
    id:
      $ref: "./common.yaml#/UUID"
    taskTemplateId:
      $ref: "./common.yaml#/UUID"
    name:
      type: string
      description: "資料表名稱"
    fields:
      type: array
      items:
        $ref: "#/DataSchemaField"
      description: "欄位定義"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

DataSchemaField:
  type: object
  description: "資料表欄位定義"
  required:
    - key
    - label
    - description
    - type
    - required
  properties:
    key:
      type: string
      description: "欄位識別鍵（schema 內唯一）"
    label:
      type: string
      description: "顯示名稱"
    description:
      type: string
      description: "用途說明"
    type:
      type: string
      enum:
        - single_line_text
        - multi_line_text
        - number
        - date
        - email
        - url
        - select
        - boolean
        - image
        - file
      description: "欄位資料型別"
    required:
      type: boolean
      description: "是否為必填欄位"
    constraints:
      $ref: "#/FieldConstraints"

FieldConstraints:
  type: object
  description: "欄位約束條件（依欄位型別而異）"
  properties:
    maxLength:
      type: integer
      description: "最大字元數（single_line_text、multi_line_text）"
    maxLines:
      type: integer
      description: "最大行數（multi_line_text）"
    min:
      type: number
      description: "最小值（number）"
    max:
      type: number
      description: "最大值（number）"
    decimal:
      type: boolean
      description: "是否允許小數（number）"
    minDate:
      type: string
      format: date
      description: "最小日期（date，ISO 8601）"
    maxDate:
      type: string
      format: date
      description: "最大日期（date，ISO 8601）"
    options:
      type: array
      items:
        type: string
      description: "可選選項列表（select）"
    maxFileSize:
      type: integer
      description: "最大檔案大小 bytes（image、file）"
    accept:
      type: array
      items:
        type: string
      description: "允許的 MIME 類型（image、file）"

# =============================================================================
# Task（任務）
# =============================================================================

TaskResponse:
  type: object
  description: "任務完整回應"
  required:
    - id
    - projectId
    - taskTemplateId
    - ownerTagId
    - name
    - status
    - createdBy
    - createdAt
    - updatedAt
  properties:
    id:
      $ref: "./common.yaml#/UUID"
    projectId:
      $ref: "./common.yaml#/UUID"
    taskTemplateId:
      $ref: "./common.yaml#/UUID"
    ownerTagId:
      $ref: "./common.yaml#/UUID"
    name:
      type: string
      description: "任務名稱"
    description:
      type: string
      nullable: true
      description: "任務描述"
    status:
      $ref: "./common.yaml#/TaskStatus"
    createdBy:
      $ref: "./common.yaml#/UUID"
    ownerTag:
      $ref: "#/MemberTagSummary"
    template:
      $ref: "#/TaskTemplateSummary"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

TaskSummary:
  type: object
  description: "任務摘要"
  required:
    - id
    - name
    - status
    - ownerTagId
  properties:
    id:
      $ref: "./common.yaml#/UUID"
    name:
      type: string
    status:
      $ref: "./common.yaml#/TaskStatus"
    ownerTagId:
      $ref: "./common.yaml#/UUID"
    ownerTag:
      $ref: "#/MemberTagSummary"
    createdAt:
      type: string
      format: date-time

# =============================================================================
# Message（訊息）
# =============================================================================

MessageResponse:
  type: object
  description: "訊息回應（不可變記錄）"
  required:
    - id
    - taskId
    - sourceType
    - content
    - createdAt
  properties:
    id:
      $ref: "./common.yaml#/UUID"
    taskId:
      $ref: "./common.yaml#/UUID"
    sourceType:
      $ref: "./common.yaml#/MessageSourceType"
    sourceId:
      $ref: "./common.yaml#/UUID"
      nullable: true
      description: "來源者 ID（source_type = member 時為 members.id）"
    content:
      oneOf:
        - $ref: '#/MemberMessageContent'
        - $ref: '#/AiSuggestionMessageContent'
        - $ref: '#/ToolExecutionMessageContent'
        - $ref: '#/SystemMessageContent'
        - $ref: '#/EmailInboundMessageContent'
      discriminator:
        propertyName: type
        mapping:
          member: '#/MemberMessageContent'
          ai_suggestion: '#/AiSuggestionMessageContent'
          tool_execution: '#/ToolExecutionMessageContent'
          system: '#/SystemMessageContent'
          email_inbound: '#/EmailInboundMessageContent'
    attachments:
      type: array
      nullable: true
      items:
        $ref: "#/Attachment"
    actionResult:
      type: object
      nullable: true
      description: "AI 建議的決策與執行結果"
    lastSeenMessageId:
      $ref: "./common.yaml#/UUID"
      nullable: true
      description: "寫入時客戶端附帶的已讀訊息 ID"
    createdAt:
      type: string
      format: date-time

MemberMessageContent:
  type: object
  required: [type, text]
  properties:
    type:
      type: string
      enum: [member]
    text:
      type: string
    mentions:
      type: array
      items:
        type: object
        properties:
          type:
            type: string
            enum: [member, tag]
          id:
            type: string
            format: uuid
          name:
            type: string

AiSuggestionMessageContent:
  type: object
  required: [type, suggestionGroupId]
  properties:
    type:
      type: string
      enum: [ai_suggestion]
    suggestionGroupId:
      type: string
      format: uuid
    summary:
      type: string

ToolExecutionMessageContent:
  type: object
  required: [type, toolName, status]
  properties:
    type:
      type: string
      enum: [tool_execution]
    toolName:
      type: string
    status:
      type: string
      enum: [success, error]
    summary:
      type: string
    result:
      type: object
      nullable: true

SystemMessageContent:
  type: object
  required: [type, event]
  properties:
    type:
      type: string
      enum: [system]
    event:
      type: string
      description: "系統事件類型，如 member_joined, task_status_changed"
    text:
      type: string

EmailInboundMessageContent:
  type: object
  description: "Email 來信訊息內容"
  required: [type, emailThreadId, emailMessageId, from, subject]
  properties:
    type:
      type: string
      enum: [email_inbound]
    emailThreadId:
      $ref: "./common.yaml#/UUID"
      description: "所屬信件串 ID"
    emailMessageId:
      $ref: "./common.yaml#/UUID"
      description: "對應的 email_messages 記錄 ID"
    from:
      type: string
      description: "寄件人 Email 地址"
    subject:
      type: string
      description: "信件主旨"
    bodyPreview:
      type: string
      description: "信件內文摘要（前 200 字元）"
    senderType:
      type: string
      enum: [member, contact, unknown]
      description: "寄件人身份類型"
    senderId:
      $ref: "./common.yaml#/UUID"
      nullable: true
      description: "解析後的寄件人 ID（member_id 或 contact_id），未知時為 null"

Attachment:
