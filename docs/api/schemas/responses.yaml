# Conf-Ops API - 回應包裝 Schema 定義
# 通用回應結構，包裝實體資料

# =============================================================================
# Aliases（路徑檔案參照名稱 → 實際 Schema）
# =============================================================================

TaskTemplateResponse:
  $ref: './entities.yaml#/TaskTemplateResponse'

TaskTemplateDetailResponse:
  type: object
  description: "任務模板詳細回應（含待辦模板與資料表定義）"
  required:
    - data
  properties:
    data:
      $ref: './entities.yaml#/TaskTemplateResponse'

TaskResponse:
  $ref: './entities.yaml#/TaskResponse'

TaskDetailResponse:
  type: object
  description: "任務詳細回應（含待辦事項、資料列等）"
  required:
    - data
  properties:
    data:
      $ref: './entities.yaml#/TaskResponse'

TodoTemplateResponse:
  $ref: './entities.yaml#/TodoTemplateResponse'

TodoResponse:
  $ref: './entities.yaml#/TodoResponse'

TodoDetailResponse:
  type: object
  description: "待辦事項詳細回應（含子待辦與指派資訊）"
  required:
    - data
  properties:
    data:
      $ref: './entities.yaml#/TodoResponse'

DataSchemaResponse:
  $ref: './entities.yaml#/DataSchemaResponse'

DataEntryResponse:
  $ref: './entities.yaml#/DataEntryResponse'

MessageResponse:
  $ref: './entities.yaml#/MessageResponse'

ConversationResponse:
  type: object
  description: "任務對話回應（訊息列表與對話中繼資訊）"
  required:
    - messages
    - meta
  properties:
    messages:
      type: array
      items:
        $ref: './entities.yaml#/MessageResponse'
    meta:
      $ref: './common.yaml#/CursorPaginationMeta'

StaleConversationErrorResponse:
  type: object
  description: "對話已過時錯誤回應（RFC 7807 Problem Details，已讀保護機制觸發時回傳）"
  required:
    - type
    - title
    - status
    - detail
    - latestMessageId
  properties:
    type:
      type: string
      format: uri
      description: "問題類型 URI"
      examples:
        - "https://conf-ops.dev/problems/stale-conversation"
    title:
      type: string
      description: "問題的簡短摘要"
      examples:
        - "Stale Conversation"
    status:
      type: integer
      description: "HTTP 狀態碼"
      examples:
        - 409
    detail:
      type: string
      description: "問題的詳細說明"
      examples:
        - "對話已有新訊息，請重新整理後再操作"
    latestMessageId:
      $ref: './common.yaml#/UUID'
      description: "伺服器端最新的訊息 ID（RFC 7807 擴充欄位）"

AggregatedDataSheetResponse:
  type: object
  description: "跨任務聚合資料表回應"
  required:
    - schema
    - entries
    - meta
  properties:
    schema:
      $ref: './entities.yaml#/DataSchemaResponse'
    entries:
      type: array
      items:
        type: object
    meta:
      $ref: './common.yaml#/CursorPaginationMeta'

ExternalTaskTemplateListResponse:
  type: object
  description: "外部可建立的任務模板列表回應"
  required:
    - items
  properties:
    items:
      type: array
      items:
        $ref: './entities.yaml#/TaskTemplateSummary'

ExternalTaskListResponse:
  type: object
  description: "外部任務列表回應"
  required:
    - items
    - meta
  properties:
    items:
      type: array
      items:
        $ref: './entities.yaml#/TaskSummary'
    meta:
      $ref: './common.yaml#/CursorPaginationMeta'

ExternalDataResponse:
  type: object
  description: "外部資料回應"
  required:
    - data
  properties:
    data:
      type: object
      additionalProperties: true
      description: "外部資料內容"

ExternalTaskDataResponse:
  type: object
  description: "外部任務資料回應（含任務與資料列）"
  required:
    - task
    - dataEntries
  properties:
    task:
      $ref: './entities.yaml#/TaskSummary'
    dataEntries:
      type: array
      items:
        $ref: './entities.yaml#/DataEntryResponse'

ShareDataResponse:
  type: object
  description: "資料分享結果回應"
  required:
    - sourceTaskId
    - targetTaskId
    - sharedFields
  properties:
    sourceTaskId:
      $ref: './common.yaml#/UUID'
    targetTaskId:
      $ref: './common.yaml#/UUID'
    sharedFields:
      type: array
      items:
        type: string
      description: "已分享的欄位 key 列表"

# =============================================================================
# 列表回應（含游標分頁）
# =============================================================================

ListResponse:
  type: object
  description: "列表回應，包含游標分頁中繼資訊與項目陣列"
  required:
    - items
    - meta
  properties:
    items:
      type: array
      description: "項目列表"
    meta:
      $ref: "./common.yaml#/CursorPaginationMeta"

