# =============================================================================
# 單一實體回應
# =============================================================================

DetailResponse:
  type: object
  description: "單一實體詳細回應"
  required:
    - data
  properties:
    data:
      type: object
      description: "實體資料"

# =============================================================================
# 建立成功回應
# =============================================================================

CreatedResponse:
  type: object
  description: "建立成功回應（HTTP 201）"
  required:
    - id
    - data
  properties:
    id:
      $ref: "./common.yaml#/UUID"
      description: "新建立資源的 ID"
    data:
      type: object
      description: "建立的實體完整資料"

# =============================================================================
# 刪除成功回應
# =============================================================================

DeletedResponse:
  type: object
  description: "刪除成功回應（HTTP 200）"
  required:
    - id
    - deletedAt
  properties:
    id:
      $ref: "./common.yaml#/UUID"
      description: "已刪除資源的 ID"
    deletedAt:
      type: string
      format: date-time
      description: "軟刪除時間（UTC）"

# =============================================================================
# 認證回應
# =============================================================================

TokenPairResponse:
  type: object
  description: "認證 Token 回應（與 auth.yaml#/TokenPair 一致，遵循 OAuth 2.0 慣例）"
  required:
    - accessToken
    - expiresIn
    - tokenType
  properties:
    accessToken:
      type: string
      description: "JWT Access Token"
    refreshToken:
      type: string
      description: "Refresh Token（用於換發新 Access Token）"
    expiresIn:
      type: integer
      description: "Access Token 有效時間（秒），遵循 OAuth 2.0 expires_in 慣例"
      examples:
        - 900
    tokenType:
      type: string
      default: "Bearer"
      description: "Token 類型"

MagicLinkResponse:
  type: object
  description: "Magic Link 發送回應"
  required:
    - message
  properties:
    message:
      type: string
      description: "操作結果訊息"
      examples:
        - "Magic link 已發送至您的 Email"

PasskeyRegistrationOptionsResponse:
  type: object
  description: "Passkey 註冊選項回應（WebAuthn）"
  required:
    - options
  properties:
    options:
      type: object
      description: "WebAuthn PublicKeyCredentialCreationOptions"

PasskeyAuthenticationOptionsResponse:
  type: object
  description: "Passkey 驗證選項回應（WebAuthn）"
  required:
    - options
  properties:
    options:
      type: object
      description: "WebAuthn PublicKeyCredentialRequestOptions"

# =============================================================================
# 健康檢查回應
# =============================================================================

HealthResponse:
  type: object
  description: "系統健康檢查回應"
  required:
    - status
    - checks
  properties:
    status:
      type: string
      enum:
        - healthy
        - degraded
        - unhealthy
      description: "整體健康狀態"
    version:
      type: string
      description: "API 版本"
    uptime:
      type: integer
      description: "服務運行時間（秒）"
    checks:
      type: object
      description: "各子系統的健康狀態"
      properties:
        database:
          $ref: "#/HealthCheck"
        crdtSync:
          $ref: "#/HealthCheck"
        emailService:
          $ref: "#/HealthCheck"
        webhookWorker:
          $ref: "#/HealthCheck"

HealthCheck:
  type: object
  description: "子系統健康檢查"
  required:
    - status
  properties:
    status:
      type: string
      enum:
        - healthy
        - degraded
        - unhealthy
      description: "子系統狀態"
    latencyMs:
      type: integer
      description: "回應延遲（毫秒）"
    message:
      type: string
      description: "附加訊息（異常時提供錯誤描述）"

# =============================================================================
# 批次操作回應
# =============================================================================

BatchMarkReadResponse:
  type: object
  description: "批次標記已讀回應"
  required:
    - updatedCount
  properties:
    updatedCount:
      type: integer
      description: "已標記為已讀的通知數量"

# =============================================================================
# 資料表聚合回應（DataSheet 虛擬視圖）
# =============================================================================

DataSheetResponse:
  type: object
  description: "資料表聚合視圖回應（DataSheet），將同一 DataSchema 下所有任務的資料列彙整"
  required:
    - schema
    - entries
    - meta
  properties:
    schema:
      $ref: "./entities.yaml#/DataSchemaResponse"
      description: "資料表定義"
    entries:
      type: array
      items:
        type: object
        required:
          - dataEntry
          - task
        properties:
          dataEntry:
            $ref: "./entities.yaml#/DataEntryResponse"
          task:
            $ref: "./entities.yaml#/TaskSummary"
      description: "資料列與對應任務的組合"
    meta:
      $ref: "./common.yaml#/CursorPaginationMeta"
