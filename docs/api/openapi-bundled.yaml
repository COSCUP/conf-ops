  /tasks/{taskId}/memory-chain:
    get:
      operationId: getTaskMemoryChain
      summary: 取得任務的記憶繼承鏈
      description: |
        取得指定任務的完整記憶繼承鏈，沿著任務的 `ownerTag` 繼承路徑收集所有相關記憶：

        帳號記憶 (Account) → 組織記憶 (Organization) → 專案記憶 (Project)
        → ownerTag 記憶 (MemberTag) → 任務模板記憶 (TaskTemplate) → 任務記憶 (Task)

        帳號記憶為當前操作帳號的個人記憶，獨立於 ownerTag 繼承鏈。
        各層級的記憶按 scope 分組回傳。
      tags:
        - Memories
      security:
        - bearerAuth: []
      x-permissions:
        - task_participant
      parameters:
        - name: taskId
          in: path
          required: true
          description: 任務 ID
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: 記憶繼承鏈
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryChainResponse'
              example:
                taskId: 018e4a2c-5f6b-7d8e-9a1b-2c3d4e5f6a7b
                chain:
                  - scopeType: account
                    scopeId: 018e4a2c-0001-7d8e-9a1b-2c3d4e5f6a7b
                    scopeName: Alice
                    memories:
                      - id: 018e4a2c-a001-7d8e-9a1b-2c3d4e5f6a7b
