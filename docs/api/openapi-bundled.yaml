          in: path
          required: true
          description: 未分類信件 ID
          schema:
            $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - taskId
              properties:
                taskId:
                  $ref: '#/components/schemas/UUID'
