  /projects/{projectId}/unassigned-inbox/{emailId}/assign:
    post:
      operationId: assignUnassignedEmail
      summary: 將未分類信件指派到任務
      description: |
        將未分類收件匣中的信件指派到指定任務。
        指派後，信件內容會新增至該任務的對話中，並觸發 AI 建議流程。
