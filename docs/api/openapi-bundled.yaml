  /tasks/{taskId}/conversation/messages:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
        description: 任務 ID
    post:
      operationId: sendMessage
      summary: 發送訊息
      description: |
        在任務對話中發送訊息。

        須附帶 `lastSeenMessageId` 進行已讀保護驗證：
        - 若 `lastSeenMessageId` 不等於對話中實際的最後一則訊息 ID，拒絕操作並回傳 409，
          要求使用者先閱讀最新訊息後再操作
        - 通過驗證後，訊息正常記錄到對話中

        發送成功後觸發 `message_sent` 事件，啟動 AI 建議流程。

        支援 `@member` 和 `@tag` 標記，系統自動發送通知給被標記的成員。
      tags:
        - Conversations
      security:
        - bearerAuth: []
      x-permissions:
        - project_owner
        - tag_admin
        - task_participant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessage'
            examples:
              text:
                summary: 純文字訊息
                value:
                  content: X 公司回覆了，表示對 A 方案有興趣，@贊助組 大家覺得可以怎麼調整？
                  lastSeenMessageId: 018e4a2c-0010-7000-8000-000000000002
              withAttachment:
                summary: 含附件的訊息
                value:
                  content: 附上 X 公司提供的 Logo 圖檔
                  lastSeenMessageId: 018e4a2c-0010-7000-8000-000000000005
                  attachments:
                    - fileName: x-company-logo.png
                      mimeType: image/png
                      fileSize: 245760
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendMessageMultipartRequest'
      responses:
        '201':
          description: 訊息發送成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: 請求參數驗證失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 無權限在此對話中發送訊息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: 已讀保護驗證失敗 — 有新的未讀訊息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaleConversationErrorResponse'
              examples:
                stale:
                  summary: 有未讀的新訊息
                  value:
                    type: https://api.conf-ops.dev/errors/stale-conversation
                    title: Stale Conversation
                    status: 409
                    detail: 對話中有新訊息尚未讀取，請先閱讀後再操作
                    lastMessageId: 018e4a2c-0010-7000-8000-000000000010
                    unseenCount: 3
  /tasks/{taskId}/conversation/sync:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
        description: 任務 ID
    post:
      operationId: syncConversation
      summary: CRDT 同步端點
      description: |
        CRDT 狀態同步端點。客戶端傳送自身的 state vector，
        伺服器回傳自該 vector 之後的所有更新。

        用於：
        - 初次載入時取得完整狀態
        - 離線重新連線後同步差異
        - 作為 WebSocket 不可用時的降級方案
      tags:
        - Conversations
      security:
        - bearerAuth: []
      x-permissions:
        - project_owner
        - tag_admin
        - task_participant
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: yrs state vector 的二進位編碼
      responses:
        '200':
          description: CRDT 更新資料
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: yrs 差異更新的二進位編碼
        '403':
          description: 無權限同步此對話
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /tasks/{taskId}/conversation/ws-token:
    parameters:
      - name: taskId
        in: path
        required: true
        description: 任務 ID
        schema:
          type: string
          format: uuid
    post:
      operationId: createConversationWsToken
      summary: 取得 WebSocket 連線用一次性 token
      description: |
        產生一次性 token 用於 WebSocket 連線認證。
        Token 有效期 30 秒，使用後即失效。
        前端取得 token 後，以 query parameter 方式連線：
        `ws://host/api/v1/tasks/{taskId}/conversation/ws?token={token}`
      tags:
        - Conversations
      security:
        - bearerAuth: []
      x-permissions:
        - task_participant
      responses:
        '200':
          description: 一次性 WebSocket token
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                  - expiresIn
                properties:
                  token:
                    type: string
                    description: 一次性 WebSocket 認證 token
                  expiresIn:
                    type: integer
                    description: Token 有效秒數
                    example: 30
              example:
                token: ws_tok_abc123...
                expiresIn: 30
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{taskId}/conversation/ws:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
        description: 任務 ID
    get:
      operationId: conversationWebSocket
      summary: 即時對話 WebSocket
      description: |
        WebSocket 連線，提供任務對話的即時雙向同步。

        連線建立後支援 CRDT 即時同步與 Awareness 協定（presence / cursor tracking）。
      tags:
        - Conversations
      security:
        - bearerAuth: []
      x-permissions:
        - project_owner
        - tag_admin
        - task_participant
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: 一次性 WebSocket 認證 token（從 REST API 取得）
      responses:
        '101':
          description: WebSocket 升級成功
      x-websocket:
        protocol: conf-ops-conversation-v1
        x-websocket-frame-types:
          description: |
            WebSocket 訊息使用兩種 frame type：
            - **Text frame (JSON)**：所有事件訊息（message_created, suggestion_created, notification, awareness_update）
            - **Binary frame**：CRDT 同步資料（yrs binary encoding）
            客戶端需檢查 frame type 以決定解析方式。
        description: |
          WebSocket 連線協定，基於 CRDT 同步機制。

          連線建立流程：
          1. 客戶端透過 REST API 取得一次性 token
          2. 以 token 作為 query parameter 建立 WebSocket 連線
          3. 連線成功後進行初始 CRDT 同步
          4. 進入即時雙向同步模式
        serverEvents:
          message_created:
            description: 新訊息建立通知
            payload:
              type: object
              properties:
                event:
                  type: string
                  const: message_created
                data:
                  $ref: '#/components/schemas/MessageResponse'
          suggestion_created:
            description: AI 建議建立通知
            payload:
              type: object
              properties:
                event:
                  type: string
                  const: suggestion_created
                data:
                  $ref: '#/components/schemas/SuggestionGroupResponse'
          crdt_update:
            description: CRDT 狀態更新
            payload:
              type: object
              properties:
                event:
                  type: string
                  const: crdt_update
                data:
                  type: object
                  properties:
                    update:
                      type: string
                      format: byte
                      description: Base64 編碼的 CRDT 更新資料
          notification:
            description: 即時通知（待辦指派、@mention 等）
            payload:
              type: object
              properties:
                event:
                  type: string
                  const: notification
                data:
                  $ref: '#/components/schemas/NotificationResponse'
        clientEvents:
          send_message:
            description: 透過 WebSocket 發送訊息
            payload:
              type: object
              properties:
                event:
                  type: string
                  const: send_message
                data:
                  $ref: '#/components/schemas/SendMessage'
          crdt_update:
            description: 客戶端 CRDT 狀態更新
            payload:
              type: object
              properties:
                event:
                  type: string
                  const: crdt_update
                data:
                  type: object
                  properties:
                    update:
                      type: string
                      format: byte
                      description: Base64 編碼的 CRDT 更新資料
          subscribe:
            description: 訂閱特定事件類型
            payload:
              type: object
              properties:
                event:
                  type: string
                  const: subscribe
                data:
                  type: object
                  properties:
                    events:
                      type: array
                      items:
                        type: string
                        enum:
                          - message_created
                          - suggestion_created
                          - crdt_update
                          - notification
        awareness:
          description: |
            Awareness 協定用於追蹤線上使用者的 presence 與 cursor 位置。

            基於 y-protocols awareness 實作：
            - 連線時自動廣播自身的 awareness 狀態
            - 定期心跳（30 秒）維持 presence
            - 斷線後 30 秒自動移除 awareness 狀態
          state:
            type: object
            properties:
              user:
                type: object
                properties:
                  id:
                    type: string
                    description: 成員 ID
                  name:
                    type: string
                    description: 成員名稱
                  avatar:
                    type: string
                    description: 成員頭像 URL
                  color:
                    type: string
                    description: 指定的顯示顏色
              cursor:
                type: object
                nullable: true
                properties:
                  position:
                    type: integer
                    description: 游標位置（輸入框中的字元偏移）
