                    suggestionsCount: 2
                    decidedCount: 1
                    createdAt: '2025-02-15T14:30:00Z'
                  - id: 018e4a2c-a002-7d8e-9a1b-2c3d4e5f6a7b
                    trigger: task_created
                    triggerMessageId: null
                    suggestionsCount: 3
                    decidedCount: 3
                    createdAt: '2025-02-15T10:00:00Z'
                pagination:
                  hasMore: false
                  nextCursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{taskId}/suggestions/{groupId}:
    get:
      operationId: getSuggestionGroup
      summary: 取得建議群組詳情
      description: |
        取得指定建議群組的完整資訊，包含每個建議的工具名稱、參數、
        AI 推理說明、使用的記憶上下文，以及目前的決策狀態。
      tags:
        - AISuggestions
      security:
        - bearerAuth: []
      x-permissions:
        - task_participant
      parameters:
        - name: taskId
          in: path
          required: true
          description: 任務 ID
          schema:
            $ref: '#/components/schemas/UUID'
        - name: groupId
          in: path
          required: true
          description: 建議群組 ID
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: 建議群組詳情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ai-suggestions_SuggestionGroup'
              example:
                id: 018e4a2c-a001-7d8e-9a1b-2c3d4e5f6a7b
                taskId: 018e4a2c-5f6b-7d8e-9a1b-2c3d4e5f6a7b
                trigger: message_sent
                triggerMessageId: 018e4a2c-m010-7d8e-9a1b-2c3d4e5f6a7b
                suggestions:
                  - id: 018e4a2c-c001-7d8e-9a1b-2c3d4e5f6a7b
                    summary: 回覆贊助商確認信
                    tool: smtp/sendEmail
                    parameters:
                      threadId: 018e4a2c-b001-7d8e-9a1b-2c3d4e5f6a7b
                      to:
                        - '{{data.contactEmail}}'
                      subject: 'Re: COSCUP 2026 贊助合作'
                      body: '{{data.contactName}} 您好，感謝確認贊助意願...'
                    reasoning: 贊助商回信確認贊助意願，應儘速回覆感謝並提供後續流程資訊
                    contextUsed:
                      - scopeType: member_tag
                        memoryId: 018e4a2c-a003-7d8e-9a1b-2c3d4e5f6a7b
                        content: 收到贊助商確認後，24 小時內回覆感謝信
                    decision: pending
                  - id: 018e4a2c-c002-7d8e-9a1b-2c3d4e5f6a7b
                    summary: 更新贊助狀態為已確認
                    tool: upsertDataEntry
                    parameters:
                      schemaId: 018e4a2c-aaaa-7d8e-9a1b-2c3d4e5f6a7b
                      fields:
                        sponsorStatus: confirmed
                    reasoning: 贊助商已確認，應更新資料表中的狀態欄位
                    contextUsed: []
                    decision: accept
                    decidedBy: 018e4a2c-1111-7d8e-9a1b-2c3d4e5f6a7b
                    decidedAt: '2025-02-15T14:35:00Z'
                createdAt: '2025-02-15T14:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{taskId}/suggestions/{groupId}/suggestions/{suggestionId}/decide:
    post:
      operationId: decideSuggestion
      summary: 對建議做出決策
      description: |
        對指定的 AI 建議做出決策。每個建議可個別決策：

        - **`accept`**：直接執行建議的工具呼叫
        - **`modify_and_accept`**：修改參數後執行，需提供 `modifiedParameters`
        - **`reject`**：拒絕建議，可附帶原因
        - **`re_suggest`**：要求 AI 重新生成建議，可附帶額外指示

        `lastSeenMessageId` 為必要欄位，確保決策者已閱讀最新對話內容。
        採納（accept / modify_and_accept）後會立即執行工具並回傳執行結果。
      tags:
        - AISuggestions
      security:
        - bearerAuth: []
      x-permissions:
        - task_participant
      parameters:
        - name: taskId
          in: path
          required: true
          description: 任務 ID
          schema:
            $ref: '#/components/schemas/UUID'
        - name: groupId
          in: path
          required: true
          description: 建議群組 ID
          schema:
            $ref: '#/components/schemas/UUID'
        - name: suggestionId
          in: path
          required: true
          description: 建議 ID
          schema:
            $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestionDecisionRequest'
            examples:
              accept:
                summary: 採納建議
                value:
                  decision: accept
                  lastSeenMessageId: 018e4a2c-ffff-7d8e-9a1b-2c3d4e5f6a7b
              modify_and_accept:
                summary: 修改後採納
                value:
                  decision: modify_and_accept
                  modifiedParameters:
                    body: '{{data.contactName}} 您好，非常感謝確認贊助，我們將於下週提供正式合約...'
                  lastSeenMessageId: 018e4a2c-ffff-7d8e-9a1b-2c3d4e5f6a7b
              reject:
                summary: 拒絕建議
                value:
                  decision: reject
                  reason: 這封信的語氣太正式，需要更親切一些
                  lastSeenMessageId: 018e4a2c-ffff-7d8e-9a1b-2c3d4e5f6a7b
              re_suggest:
                summary: 要求重新建議
                value:
                  decision: re_suggest
                  reason: 語氣需要調整
                  additionalInstructions: 請用更輕鬆友善的語氣重寫這封信，並加上下一步行動項目
                  lastSeenMessageId: 018e4a2c-ffff-7d8e-9a1b-2c3d4e5f6a7b
      responses:
        '200':
          description: 決策已記錄（採納時包含工具執行結果）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionDecisionResponse'
              example:
                suggestion:
                  id: 018e4a2c-c001-7d8e-9a1b-2c3d4e5f6a7b
                  summary: 回覆贊助商確認信
                  tool: smtp/sendEmail
                  decision: accept
                  decidedBy: 018e4a2c-1111-7d8e-9a1b-2c3d4e5f6a7b
                  decidedAt: '2025-02-15T14:40:00Z'
                executionResult:
                  success: true
                  result:
                    emailId: 018e4a2c-e001-7d8e-9a1b-2c3d4e5f6a7b
                    threadId: 018e4a2c-b001-7d8e-9a1b-2c3d4e5f6a7b
                  messageId: 018e4a2c-m011-7d8e-9a1b-2c3d4e5f6a7b
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 對話已有新訊息，需先閱讀最新內容；或建議已被決策
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                stale_conversation:
                  summary: 未讀新訊息
                  value:
                    type: https://api.conf-ops.dev/errors/stale-conversation
                    title: Conversation Has New Messages
                    status: 409
                    detail: 對話中有未讀訊息，請先閱讀最新內容後再操作
                already_decided:
                  summary: 建議已被決策
                  value:
                    type: https://api.conf-ops.dev/errors/already-decided
                    title: Suggestion Already Decided
                    status: 409
                    detail: 此建議已被其他參與人決策
  /tasks/{taskId}/suggestions/request:
    post:
      operationId: requestAISuggestions
      summary: 手動請求 AI 建議
