            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /email/inbound:
    post:
      operationId: receiveInboundEmail
      summary: 接收外部來信
      description: |
        接收外部 Email 的 webhook 端點，供郵件伺服器（如 Postfix、SendGrid Inbound Parse）
        將收到的信件轉送至系統。

        處理流程：
        1. 解析寄件者 `sender`、主旨 `subject`、內容 `body`、附件 `attachments`
        2. 判斷來源身份：Member 來信、Contact 來信、或成員轉寄
        3. 嘗試匹配任務：優先 Email Header 匹配、次要啟發式匹配
        4. 匹配成功：在任務對話中新增訊息，觸發 AI 建議
        5. 匹配失敗：歸入專案的未分類收件匣

        此端點使用 `X-Webhook-Secret` header 驗證請求來源，不使用 Bearer Token。
      tags:
        - EmailInbound
      security: []
      parameters:
        - name: X-Webhook-Secret
          in: header
          required: true
          description: Webhook 密鑰，用於驗證請求來源
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundEmailJson'
            example:
              from:
                name: Sponsor Contact
                address: contact@sponsor.com
              to:
                - address: coscup-discuss@conf-ops.example.com
              cc:
                - address: alice@example.com
              subject: 'Re: COSCUP 2026 贊助合作'
              textBody: 您好，我們確認贊助金額為 NT$100,000...
              htmlBody: <p>您好，我們確認贊助金額為 NT$100,000...</p>
              headers:
                message-id: <abc123@sponsor.com>
                in-reply-to: <def456@conf-ops.example.com>
                references: <def456@conf-ops.example.com> <ghi789@conf-ops.example.com>
              attachments:
                - filename: contract.pdf
                  contentType: application/pdf
                  size: 204800
                  content: base64-encoded-content...
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InboundEmailMultipart'
      responses:
        '200':
          description: Email 處理完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundEmailResponse'
              examples:
                matched:
                  summary: 成功匹配到任務
                  value:
                    status: matched
                    taskId: 018e4a2c-5f6b-7d8e-9a1b-2c3d4e5f6a7b
                    messageId: 018e4a2c-m012-7d8e-9a1b-2c3d4e5f6a7b
                    threadId: 018e4a2c-b001-7d8e-9a1b-2c3d4e5f6a7b
                unmatched:
                  summary: 無法匹配，歸入未分類收件匣
                  value:
                    status: unmatched
                    emailId: 018e4a2c-c001-7d8e-9a1b-2c3d4e5f6a7b
                    projectId: 018e4a2c-5f6b-7d8e-9a1b-2c3d4e5f6a7b
        '400':
          description: Email 格式錯誤或無法解析
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://api.conf-ops.dev/errors/invalid-email
                title: Invalid Email Format
                status: 400
                detail: 無法解析 Email 內容
        '401':
          description: Webhook 密鑰驗證失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://api.conf-ops.dev/errors/unauthorized
                title: Unauthorized
                status: 401
                detail: X-Webhook-Secret 驗證失敗
