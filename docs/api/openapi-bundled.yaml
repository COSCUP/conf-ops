        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{taskId}/suggestions:
    get:
      operationId: listSuggestionGroups
      summary: 列出任務的建議群組
      description: |
        列出指定任務的所有 AI 建議群組，支援游標分頁。
        每個建議群組包含 1~5 個建議（Suggestion），
        按觸發時間降冪排序（最新優先）。
      tags:
        - AISuggestions
      security:
        - bearerAuth: []
      x-permissions:
        - task_participant
      parameters:
        - name: taskId
          in: path
          required: true
          description: 任務 ID
          schema:
            $ref: '#/components/schemas/UUID'
        - name: cursor
          in: query
          description: 分頁游標
          schema:
            type: string
        - name: limit
          in: query
          description: 每頁數量
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: 建議群組列表
          content:
            application/json:
              schema:
                type: object
