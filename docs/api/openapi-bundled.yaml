    get:
      operationId: getToolDetails
      summary: 取得工具詳細資訊
      description: |
        取得指定工具的詳細定義，包含 MCP tool definition 格式的
        參數結構（inputSchema）、回傳結構、使用說明等。
      tags:
        - Tools
      security:
        - bearerAuth: []
      x-permissions:
        - project_member
      parameters:
        - name: projectId
          in: path
          required: true
          description: 專案 ID
          schema:
            $ref: '#/components/schemas/UUID'
        - name: toolName
          in: path
          required: true
          description: 工具名稱（如 `createTask`、`smtp/sendEmail`）
          schema:
            type: string
          example: createTask
      responses:
        '200':
          description: 工具詳細定義
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolDefinition'
              example:
                name: createTask
                displayName: 建立任務
                category: core
                type: write
                description: 從任務模板建立新任務
                inputSchema:
                  type: object
                  properties:
                    taskTemplateId:
                      type: string
                      format: uuid
                      description: 任務模板 ID
                    name:
                      type: string
                      description: 任務名稱
                    ownerTagId:
                      type: string
                      format: uuid
                      description: 歸屬成員標籤 ID
                    parentTodoId:
                      type: string
                      format: uuid
