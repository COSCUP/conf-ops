          type: string
          format: uuid
    get:
      operationId: getProjectPermissionSettings
      summary: 取得專案權限設定
      description: |
        取得專案的權限設定，包含任務可見性、工具權限、記憶可見性、資料存取等設定。
        僅專案擁有者（`owner`）可操作。
      tags:
        - Projects
      security:
        - bearerAuth: []
      x-permissions:
        - project_owner
      responses:
        '200':
          description: 專案權限設定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionSettingsResponse'
              example:
                taskVisibility:
                  - tag: 贊助組
                    allow:
                      - own_tag_tasks
                    deny: []
                  - tag: 資訊組
                    allow:
                      - own_tag_tasks
                      - cross_tag_linked_tasks
                    deny: []
                toolPermissions:
                  - tag: 贊助組
                    allow:
                      - smtp/sendEmail
                    deny: []
                memoryVisibility:
                  - tag: '*'
                    allow:
                      - project_memories
                      - own_tag_memories
                    deny:
                      - other_tag_memories
                dataAccess:
                  - tag: 贊助組
                    allow:
                      - own_tag_data
                    deny:
                      - other_tag_data
