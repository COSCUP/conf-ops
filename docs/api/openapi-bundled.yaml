  /projects/{projectId}/tasks/{taskId}/status:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
        description: 專案 ID
      - name: taskId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
        description: 任務 ID
    put:
      operationId: updateTaskStatus
      summary: 更新任務狀態
      description: |
        更新任務的狀態。狀態轉換規則：

        - `pending` → `in_progress`：當任務有實質活動時自動轉換，也可手動觸發
        - `in_progress` → `completed`：所有待辦事項皆已完成後，由參與人手動標記
        - 任何狀態 → `cancelled`：由參與人手動標記

        標記為 `completed` 時，若有未完成的待辦事項，將回傳 409 錯誤。
      tags:
        - Tasks
      security:
        - bearerAuth: []
      x-permissions:
        - project_owner
        - tag_admin
        - task_participant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskStatus'
            examples:
              complete:
                summary: 標記任務完成
                value:
                  status: completed
              cancel:
                summary: 取消任務
                value:
                  status: cancelled
                  reason: 贊助商表示今年不參加
      responses:
        '200':
          description: 狀態更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: 無效的狀態轉換
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 無權限更新此任務狀態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: 衝突 — 例如嘗試標記完成但仍有未完成的待辦事項
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                incompleteTodos:
                  summary: 仍有未完成的待辦事項
                  value:
                    type: https://api.conf-ops.dev/errors/incomplete-todos
                    title: Cannot Complete Task
                    status: 409
                    detail: 任務仍有 3 個未完成的待辦事項，請先完成所有待辦事項再標記任務完成
