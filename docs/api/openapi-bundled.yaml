          type: string
          format: uuid
    put:
      operationId: updateProjectStatus
      summary: 更新專案狀態
      description: |
        更新專案狀態。狀態轉換規則：
        - `preparing` → `active`
        - `active` → `completed` 或 `archived`
        - `completed` → `archived`
        - `archived` 為終態，不可再變更

        僅專案擁有者（`owner`）可操作。
      tags:
        - Projects
      security:
        - bearerAuth: []
      x-permissions:
        - project_owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectStatusRequest'
            example:
              status: active
      responses:
        '200':
          description: 專案狀態更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          description: 不允許的狀態轉換
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://conf-ops.io/errors/invalid-status-transition
                title: Invalid Status Transition
                status: 400
                detail: 不允許從 preparing 直接轉換到 completed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
