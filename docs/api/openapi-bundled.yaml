openapi: 3.1.0
info:
  title: Conf-Ops API
  version: 1.0.0
  description: |
    Conf-Ops — AI 輔助的研討會/活動專案管理系統 API。

    內部 API 端點使用 `/api/v1/` 前綴，外部資料 API 使用 `/external/v1/` 前綴。
    認證使用 JWT Bearer Token（透過 Passkey 或 Magic Link 取得）。
    外部資料 API 使用專案層級 API Key 認證。

    ## 分頁
    使用 cursor-based 分頁，回傳 opaque cursor token。

    ## 錯誤處理
    遵循 RFC 7807 Problem Details 格式。

    ## 即時通訊
    任務對話支援 WebSocket 連線（CRDT 同步 + 即時更新 + 通知推送）。
  contact:
    name: Conf-Ops Team
  license:
    name: MIT
servers:
  - url: /api/v1
    description: API v1 主要端點
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: 認證 — Passkey (WebAuthn) + Email Magic Link
  - name: Accounts
    description: 帳號管理 — 個人資料、偏好設定、個人資料表
  - name: Organizations
    description: 組織管理 — 成員、聯絡人、工具設定
  - name: Projects
    description: 專案管理 — 建立、複製、權限設定
  - name: Members
    description: 專案成員管理 — 邀請、角色、標籤指派
  - name: Contacts
    description: 外部聯絡人管理 — 建立、合併、標籤指派
  - name: MemberTags
    description: 成員標籤管理 — 角色/組別定義、外部建立任務設定
  - name: TaskTemplates
    description: 任務模板管理 — 待辦模板、資料表定義、資料表聚合
  - name: Tasks
    description: 任務管理 — 建立、狀態轉換、參與人
  - name: Conversations
    description: 任務對話 — 訊息、CRDT 同步、WebSocket、附件
  - name: Todos
    description: 待辦事項管理 — 建立、指派、關聯任務、狀態更新
  - name: DataSheets
    description: 資料表 — 資料列新增/修改、跨任務聚合、資料分享
  - name: ExternalData
    description: 外部資料 API — 唯讀、專案層級 API Key 認證
  - name: Tools
    description: 執行工具 — MCP 工具執行、工具設定管理
  - name: ToolConfigs
    description: 工具設定管理
  - name: Memories
    description: 記憶系統 — 記憶 CRUD、記憶庫文件、繼承鏈查詢
  - name: Notifications
    description: 通知系統 — 通知列表、已讀標記、偏好設定、Web Push 訂閱
  - name: AISuggestions
    description: AI 建議 — SuggestionGroup 生命週期、決策操作
  - name: Email
    description: 電子郵件整合 — 收信 webhook、未分類收件匣
  - name: EmailInbound
    description: 電子郵件接收 — LMTP/HTTP webhook 收信處理
  - name: LibraryDocuments
    description: 記憶庫文件 — 文件 CRUD、版本歷史
  - name: Webhooks
    description: Webhook — 設定管理、事件日誌、外部系統整合
  - name: Files
    description: 檔案儲存 — 上傳、下載、刪除檔案
  - name: Operations
    description: 運維端點 — 健康檢查、就緒探測、Prometheus 指標
paths:
  /auth/passkey/register/begin:
    post:
      operationId: passkeyRegisterBegin
      summary: 開始 Passkey 註冊
      description: |
        啟動 WebAuthn 註冊流程，回傳 `PublicKeyCredentialCreationOptions`，
        前端據此呼叫 `navigator.credentials.create()` 產生憑證。
        需要已登入的使用者才能新增 Passkey。
      tags:
        - Auth
      security:
        - bearerAuth: []
      x-permissions:
        - authenticated
      responses:
        '200':
          description: WebAuthn 註冊挑戰已產生
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyRegisterBeginResponse'
              example:
                challenge: dGVzdC1jaGFsbGVuZ2U...
                rp:
                  name: Conf-Ops
                  id: conf-ops.example.com
                user:
                  id: dXNlci1pZA...
                  name: user@example.com
                  displayName: Alice
                pubKeyCredParams:
                  - type: public-key
                    alg: -7
                timeout: 60000
                attestation: none
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/passkey/register/complete:
    post:
      operationId: passkeyRegisterComplete
      summary: 完成 Passkey 註冊
      description: |
        接收前端呼叫 `navigator.credentials.create()` 的回傳結果，
        驗證並儲存新的 Passkey 憑證。
      tags:
        - Auth
      security:
        - bearerAuth: []
      x-permissions:
        - authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyRegisterCompleteRequest'
            example:
              id: credential-id-base64url
              rawId: credential-raw-id-base64url
              response:
                attestationObject: attestation-object-base64url
                clientDataJSON: client-data-json-base64url
              type: public-key
      responses:
        '200':
          description: Passkey 註冊成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyRegisterCompleteResponse'
              example:
                credentialId: credential-id-base64url
                createdAt: '2025-01-15T10:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/passkey/login/begin:
    post:
      operationId: passkeyLoginBegin
      summary: 開始 Passkey 登入
      description: |
        啟動 WebAuthn 認證流程，回傳 `PublicKeyCredentialRequestOptions`，
        前端據此呼叫 `navigator.credentials.get()` 進行驗證。
        不需要預先登入。
      tags:
        - Auth
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyLoginBeginRequest'
            example:
              email: user@example.com
      responses:
        '200':
          description: WebAuthn 認證挑戰已產生
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyLoginBeginResponse'
              example:
                challenge: bG9naW4tY2hhbGxlbmdl...
                timeout: 60000
                rpId: conf-ops.example.com
                allowCredentials:
                  - type: public-key
                    id: credential-id-base64url
  /auth/passkey/login/complete:
    post:
      operationId: passkeyLoginComplete
      summary: 完成 Passkey 登入
      description: |
        接收前端呼叫 `navigator.credentials.get()` 的回傳結果，
        驗證後發放 JWT Token Pair（access token + refresh token）。
        Refresh token 同時以 HTTP-only cookie 設定。
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyLoginCompleteRequest'
            example:
              id: credential-id-base64url
              rawId: credential-raw-id-base64url
              response:
                authenticatorData: authenticator-data-base64url
                clientDataJSON: client-data-json-base64url
                signature: signature-base64url
              type: public-key
      responses:
        '200':
          description: 登入成功，回傳 Token Pair
          headers:
            Set-Cookie:
              description: HTTP-only cookie 包含 refresh token
              schema:
                type: string
                example: refresh_token=eyJ...; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                accessToken: eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9...
                refreshToken: eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9...
                expiresIn: 900
                tokenType: Bearer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 認證失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://conf-ops.io/errors/authentication-failed
                title: Authentication Failed
                status: 401
                detail: Passkey 驗證失敗
  /auth/magic-link/request:
    post:
      operationId: magicLinkRequest
      summary: 請求 Magic Link 登入連結
      description: |
        輸入 Email 地址，系統寄送一次性登入連結到該信箱。
        不論帳號是否存在，皆回傳相同成功訊息，防止帳號列舉攻擊。若帳號不存在，系統會自動建立新帳號並寄送 Magic Link。
        為防止濫用，同一 Email 有頻率限制。
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkRequestBody'
            example:
              email: user@example.com
      responses:
        '200':
          description: Magic Link 已寄出（無論帳號是否存在，皆回傳成功以防止列舉攻擊）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MagicLinkRequestResponse'
              example:
                message: 若該 Email 已註冊，將收到登入連結
        '429':
          description: 請求過於頻繁
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://conf-ops.io/errors/rate-limit-exceeded
                title: Rate Limit Exceeded
                status: 429
                detail: 請求過於頻繁，請稍後再試
  /auth/magic-link/verify:
    get:
      operationId: magicLinkVerify
      summary: 驗證 Magic Link Token
      description: |
        驗證 Magic Link 中的一次性 token，成功後發放 JWT Token Pair。
        Token 僅能使用一次，使用後即失效。
        Refresh token 同時以 HTTP-only cookie 設定。

        注意：Email 中的 Magic Link 應指向前端應用 URL（如 `https://app.conf-ops.io/auth/magic-link?token=xxx`），由前端應用擷取 token 後呼叫此 API 端點取得 Token Pair，而非直接將使用者導向此 API URL。
      tags:
        - Auth
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: Magic Link 中的一次性驗證 token
          schema:
            type: string
      responses:
        '200':
          description: 驗證成功，回傳 Token Pair
          headers:
            Set-Cookie:
              description: HTTP-only cookie 包含 refresh token
              schema:
                type: string
                example: refresh_token=eyJ...; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                accessToken: eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9...
                refreshToken: eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9...
                expiresIn: 900
                tokenType: Bearer
        '400':
          description: Token 無效或已過期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://conf-ops.io/errors/invalid-token
                title: Invalid Token
                status: 400
                detail: 登入連結無效或已過期
  /auth/refresh:
    post:
      operationId: authRefresh
      summary: 重新整理 Access Token
      description: |
        使用 HTTP-only cookie 中的 refresh token 取得新的 access token。
        實作 refresh token rotation — 每次使用後舊的 refresh token 失效，
        同時發放新的 refresh token。
      tags:
        - Auth
      security: []
      parameters:
        - name: Cookie
          in: cookie
          description: 包含 refresh_token 的 HTTP-only cookie
          schema:
            type: string
      responses:
        '200':
          description: Token 重新整理成功
          headers:
            Set-Cookie:
              description: 新的 HTTP-only cookie 包含 refresh token
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                accessToken: eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9...
                refreshToken: eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9...
                expiresIn: 900
                tokenType: Bearer
        '401':
          description: Refresh token 無效或已過期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://conf-ops.io/errors/invalid-refresh-token
                title: Invalid Refresh Token
                status: 401
                detail: Refresh token 無效或已過期
  /auth/logout:
    post:
      operationId: authLogout
      summary: 登出
      description: |
        撤銷當前的 refresh token，使其無法再用於取得新的 access token。
        同時清除 HTTP-only cookie 中的 refresh token。
      tags:
        - Auth
      security:
        - bearerAuth: []
      x-permissions:
        - authenticated
      responses:
        '204':
          description: 登出成功，refresh token 已撤銷
          headers:
            Set-Cookie:
              description: 清除 refresh token cookie
              schema:
                type: string
                example: refresh_token=; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=0
        '401':
          $ref: '#/components/responses/Unauthorized'
  /accounts/me:
    get:
      operationId: getCurrentAccount
      summary: 取得當前帳號資訊
      description: |
        回傳當前登入帳號的公開資訊，包含名稱、Email、頭像、自我介紹、語系等。
        不包含私人資料（`profileData`）。
      tags:
        - Accounts
      security:
        - bearerAuth: []
      x-permissions:
        - authenticated
      responses:
        '200':
          description: 帳號資訊
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
              example:
                id: 019409a2-c5f2-7000-8000-000000000001
                name: Alice Chen
                email: alice@example.com
                avatarUrl: https://cdn.example.com/avatars/alice.jpg
                bio: 開源社群愛好者，專注於活動籌備
                locale: zh-TW
                createdAt: '2025-01-01T00:00:00Z'
                updatedAt: '2025-06-15T10:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: updateCurrentAccount
      summary: 更新當前帳號資訊
      description: |
        更新當前登入帳號的公開資訊。僅傳入需要更新的欄位。
        可更新：名稱 `name`、自我介紹 `bio`、頭像 `avatarUrl`、語系 `locale`。
      tags:
        - Accounts
      security:
        - bearerAuth: []
      x-permissions:
        - authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
            example:
              name: Alice Chen
              bio: 開源社群愛好者，專注於活動籌備與社群經營
              locale: zh-TW
      responses:
        '200':
          description: 帳號資訊更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
              example:
                id: 019409a2-c5f2-7000-8000-000000000001
                name: Alice Chen
                email: alice@example.com
                avatarUrl: https://cdn.example.com/avatars/alice.jpg
                bio: 開源社群愛好者，專注於活動籌備與社群經營
                locale: zh-TW
                createdAt: '2025-01-01T00:00:00Z'
                updatedAt: '2025-06-16T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /accounts/me/profile:
    get:
      operationId: getCurrentAccountProfile
      summary: 取得個人資料表
      description: |
        回傳當前帳號的私人結構化資料（`profileData`）與欄位結構（`profileSchema`）。
        僅帳號本人可存取，不對外公開，也不傳送給 AI。
      tags:
        - Accounts
      security:
        - bearerAuth: []
      x-permissions:
        - authenticated
      responses:
        '200':
          description: 個人資料表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
              example:
                profileData:
                  phone: +886-912-345-678
                  address: 台北市信義區...
                  dietary_preference: 素食
                profileSchema:
                  - key: phone
                    label: 聯絡電話
                    description: 個人手機號碼
                    type: string
                  - key: address
                    label: 通訊地址
                    description: 收件地址
                    type: string
                  - key: dietary_preference
                    label: 飲食偏好
                    description: 素食、葷食或其他飲食需求
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: updateCurrentAccountProfile
      summary: 更新個人資料表
      description: |
        更新當前帳號的私人結構化資料。以 merge 方式更新 — 僅覆蓋傳入的欄位，
        未傳入的欄位保持不變。設定欄位值為 `null` 可刪除該欄位。
        系統自動維護 `profileSchema`。
      tags:
        - Accounts
      security:
        - bearerAuth: []
      x-permissions:
        - authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              profileData:
                phone: +886-912-345-678
                dietary_preference: 素食
      responses:
        '200':
          description: 個人資料表更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
              example:
                profileData:
                  phone: +886-912-345-678
                  address: 台北市信義區...
                  dietary_preference: 素食
                profileSchema:
                  - key: phone
                    label: 聯絡電話
                    description: 個人手機號碼
                    type: string
                  - key: address
                    label: 通訊地址
                    description: 收件地址
                    type: string
                  - key: dietary_preference
                    label: 飲食偏好
                    description: 素食、葷食或其他飲食需求
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /accounts/me/todos:
    get:
      operationId: getCurrentAccountTodos
      summary: 取得個人所有待辦事項
      description: |
        取得當前帳號在所有專案中被指派的待辦事項，支援 cursor 分頁。
        可依專案、狀態、截止日期篩選。
      tags:
        - Accounts
      security:
        - bearerAuth: []
      x-permissions:
        - authenticated
      parameters:
        - name: cursor
          in: query
          description: 分頁游標，用於取得下一頁資料
          schema:
            type: string
        - name: limit
          in: query
          description: 每頁筆數，預設 20，最大 100
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: projectId
          in: query
          description: 依專案 ID 篩選
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: 依待辦狀態篩選
          schema:
            type: string
            enum:
              - open
              - completed
      responses:
        '200':
          description: 待辦事項列表（cursor 分頁）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoListResponse'
              example:
                items:
                  - id: 019409a2-c5f2-7000-8000-000000000010
                    title: 確認贊助方案內容
                    status: open
                    dueDate: '2025-07-01T00:00:00Z'
                    taskId: 019409a2-c5f2-7000-8000-000000000020
                    taskName: 與 A 贊助商保持聯絡
                    projectId: 019409a2-c5f2-7000-8000-000000000030
                    projectName: COSCUP 2025
                nextCursor: eyJpZCI6IjAxOTQwOWEyLWM1ZjItNzAwMC04MDAwLTAwMDAwMDAwMDAxMCJ9
                hasMore: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /accounts/me/notifications:
    get:
      operationId: getCurrentAccountNotifications
      summary: 取得通知列表
      description: |
        取得當前帳號的通知列表，依建立時間倒序排列。
        支援 cursor 分頁，可依已讀狀態與專案篩選。
      tags:
        - Accounts
      security:
        - bearerAuth: []
      x-permissions:
        - authenticated
      parameters:
        - name: cursor
          in: query
          description: 分頁游標
          schema:
            type: string
        - name: limit
          in: query
          description: 每頁筆數，預設 20，最大 100
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: isRead
          in: query
          description: 依已讀狀態篩選
          schema:
            type: boolean
        - name: projectId
          in: query
          description: 依專案 ID 篩選
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 通知列表（cursor 分頁）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
              example:
                items:
                  - id: 019409a2-c5f2-7000-8000-000000000040
                    type: todo_assigned
                    title: 你有一項新的待辦事項
                    body: 「確認贊助方案內容」已指派給你
                    referenceType: todo
                    referenceId: 019409a2-c5f2-7000-8000-000000000010
                    projectId: 019409a2-c5f2-7000-8000-000000000030
                    isRead: false
                    createdAt: '2025-06-15T10:30:00Z'
