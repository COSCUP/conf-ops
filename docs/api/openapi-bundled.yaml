      required:
        - status
      properties:
        status:
          type: string
          enum:
            - healthy
            - degraded
            - unhealthy
          description: 子系統狀態
        latencyMs:
          type: integer
          description: 回應延遲（毫秒）
        message:
          type: string
          description: 附加訊息（異常時提供錯誤描述）
  responses:
    Unauthorized:
      description: 401 Unauthorized — 未認證或 token 已過期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.conf-ops.dev/errors/unauthorized
            title: Unauthorized
            status: 401
            detail: 存取 token 無效或已過期
    BadRequest:
      description: 400 Bad Request — 請求參數錯誤或驗證失敗
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.conf-ops.dev/errors/validation
            title: Validation Error
            status: 400
            detail: 請求內容驗證失敗
            errors:
              - field: name
                message: 名稱為必填欄位
                code: required
    Forbidden:
      description: 403 Forbidden — 無權限執行此操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.conf-ops.dev/errors/forbidden
            title: Forbidden
            status: 403
            detail: 您無權限執行此操作
    NotFound:
      description: 404 Not Found — 請求的資源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://api.conf-ops.dev/errors/not-found
            title: Not Found
            status: 404
            detail: 請求的資源不存在
