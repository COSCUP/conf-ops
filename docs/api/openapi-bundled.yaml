        - bearerAuth: []
      x-permissions:
        - project_owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePermissionSettingsRequest'
            example:
              taskVisibility:
                - tag: '*'
                  allow:
                    - own_tag_tasks
                  deny: []
              toolPermissions:
                - tag: '*'
                  allow:
                    - smtp/sendEmail
                  deny: []
              memoryVisibility:
                - tag: '*'
                  allow:
                    - project_memories
                    - own_tag_memories
                  deny: []
              dataAccess:
                - tag: '*'
                  allow:
                    - own_tag_data
                  deny: []
      responses:
        '200':
          description: 權限設定更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionSettingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
