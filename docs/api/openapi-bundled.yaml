  /projects/{projectId}/tools/{toolName}/execute:
    post:
      operationId: executeTool
      summary: 執行工具
      description: |
        執行指定工具。寫入工具需經人類確認後才實際執行（透過 AI 建議流程時由建議決策觸發，
        手動執行時直接送出）。查詢工具不需確認即可執行。

        `lastSeenMessageId` 用於對話同步驗證：伺服器檢查使用者是否已看到最新對話訊息，
        若有未讀訊息則拒絕操作，確保決策品質。
      tags:
        - Tools
      security:
        - bearerAuth: []
      x-permissions:
        - task_participant
      parameters:
        - name: projectId
          in: path
          required: true
          description: 專案 ID
          schema:
            $ref: '#/components/schemas/UUID'
        - name: toolName
          in: path
          required: true
          description: 工具名稱
          schema:
            type: string
          example: upsertDataEntry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolExecuteRequest'
            example:
              taskId: 018e4a2c-5f6b-7d8e-9a1b-2c3d4e5f6a7b
              parameters:
                schemaId: 018e4a2c-aaaa-7d8e-9a1b-2c3d4e5f6a7b
                fields:
                  companyName: ACME Corp
                  contactEmail: sponsor@acme.com
              lastSeenMessageId: 018e4a2c-ffff-7d8e-9a1b-2c3d4e5f6a7b
      responses:
        '200':
          description: 工具執行成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolExecuteResponse'
              example:
                success: true
                result:
                  entryId: 018e4a2c-bbbb-7d8e-9a1b-2c3d4e5f6a7b
                  updatedFields:
                    - companyName
                    - contactEmail
                messageId: 018e4a2c-cccc-7d8e-9a1b-2c3d4e5f6a7b
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 對話已有新訊息，需先閱讀最新內容
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://api.conf-ops.dev/errors/stale-conversation
                title: Conversation Has New Messages
                status: 409
                detail: 對話中有未讀訊息，請先閱讀最新內容後再操作
