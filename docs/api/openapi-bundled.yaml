          format: uuid
    post:
      operationId: assignMemberTag
      summary: 指派成員或聯絡人到標籤
      description: |
        將一位成員（Member）或聯絡人（Contact）指派到指定的成員標籤。
        必須提供 `memberId` 或 `contactId` 其中之一。
        不可重複指派同一成員或聯絡人到同一標籤。

        僅專案擁有者（`owner`）與該標籤的管理者（`tag_admin`）可操作。
      tags:
        - MemberTags
      security:
        - bearerAuth: []
      x-permissions:
        - project_owner
        - tag_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTagRequest'
            examples:
              assignMember:
                summary: 指派成員
                value:
                  memberId: 019409a2-c5f2-7000-8000-000000000502
              assignContact:
                summary: 指派聯絡人
                value:
                  contactId: 019409a2-c5f2-7000-8000-000000000300
      responses:
        '201':
          description: 指派成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagAssignmentResponse'
              example:
                id: 019409a2-c5f2-7000-8000-000000000802
                tagId: 019409a2-c5f2-7000-8000-000000000601
                memberId: 019409a2-c5f2-7000-8000-000000000502
                contactId: null
                projectId: 019409a2-c5f2-7000-8000-000000000400
                createdAt: '2025-06-17T09:00:00Z'
        '400':
          description: 請求無效（如同時提供 memberId 與 contactId）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://conf-ops.io/errors/bad-request
                title: Bad Request
                status: 400
                detail: 必須提供 memberId 或 contactId 其中之一
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 該成員或聯絡人已被指派到此標籤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://conf-ops.io/errors/conflict
                title: Conflict
                status: 409
                detail: 該成員已被指派到此標籤
