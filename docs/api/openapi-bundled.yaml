        webPush:
          $ref: '#/components/schemas/ChannelPreference'
        inApp:
          $ref: '#/components/schemas/ChannelPreference'
    ChannelPreferenceUpdate:
      type: object
      description: 單一通知頻道的偏好更新（部分更新）
      properties:
        enabled:
          type: boolean
          description: 此頻道是否啟用
        types:
          type: object
          description: 各通知類型的啟用狀態（僅傳入要修改的類型）
          properties:
            todo_assigned:
              type: boolean
            member_mentioned:
              type: boolean
            tag_mentioned:
              type: boolean
            task_completed:
              type: boolean
            linked_task_completed:
              type: boolean
            source_data_changed:
              type: boolean
            reminder:
              type: boolean
    UpdateNotificationPreferencesRequest:
      type: object
      description: 更新通知偏好設定請求。僅需傳入要修改的部分，未傳入的設定維持不變。
      properties:
        email:
          $ref: '#/components/schemas/ChannelPreferenceUpdate'
        webPush:
          $ref: '#/components/schemas/ChannelPreferenceUpdate'
        inApp:
          $ref: '#/components/schemas/ChannelPreferenceUpdate'
    WebPushSubscribeRequest:
      type: object
      description: Web Push 訂閱請求，將瀏覽器的 push subscription 物件送至伺服器
      required:
        - subscription
      properties:
        subscription:
          type: object
          description: 瀏覽器 PushSubscription 物件
          required:
            - endpoint
            - keys
          properties:
            endpoint:
              type: string
              format: uri
              description: Push service 的訂閱端點 URL
            keys:
              type: object
              description: 加密金鑰
              required:
                - p256dh
                - auth
              properties:
                p256dh:
                  type: string
                  description: P-256 Diffie-Hellman 公鑰（Base64 URL 編碼）
                auth:
                  type: string
                  description: 認證密鑰（Base64 URL 編碼）
        deviceName:
          type: string
          nullable: true
          description: 裝置名稱（用於使用者辨識不同訂閱）
          examples:
            - Chrome on MacBook
            - Firefox on Desktop
    SuggestionGroupSummary:
      type: object
      description: AI 建議群組摘要，用於列表顯示
      required:
        - id
        - trigger
        - suggestionsCount
        - decidedCount
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        trigger:
          type: string
          enum:
            - task_created
            - todo_completed
            - message_sent
            - tool_error
            - source_data_changed
            - manual_request
          description: 觸發此建議的事件類型
        triggerMessageId:
          $ref: '#/components/schemas/UUID'
          nullable: true
          description: 觸發事件的訊息 ID
        suggestionsCount:
          type: integer
          description: 建議總數
        decidedCount:
          type: integer
          description: 已決策的建議數量
        createdAt:
          type: string
          format: date-time
          description: 建議群組建立時間（UTC）
    SuggestionContextRef:
      type: object
      description: 建議生成時引用的記憶上下文
      properties:
        scopeType:
          $ref: '#/components/schemas/ScopeType'
          description: 記憶的作用域類型
        memoryId:
          $ref: '#/components/schemas/UUID'
          description: 引用的記憶 ID
        content:
          type: string
          description: 記憶內容摘要
    SuggestionDecisionType:
      type: string
      enum:
        - pending
        - accept
        - modify_and_accept
        - reject
        - re_suggest
      description: AI 建議決策狀態
    ai-suggestions_Suggestion:
      type: object
      description: 單一 AI 建議的完整資訊
      required:
        - id
        - summary
        - tool
        - parameters
        - reasoning
        - decision
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        summary:
          type: string
          description: 人類可讀的建議摘要
        tool:
          type: string
          description: 建議執行的 MCP 工具名稱（如 'smtp/sendEmail'、'upsertDataEntry'）
        parameters:
          type: object
          description: 工具呼叫參數（對應 MCP tool call 的 arguments）
        reasoning:
          type: string
          description: AI 提出此建議的推理說明
        contextUsed:
          type: array
          items:
            $ref: '#/components/schemas/SuggestionContextRef'
          description: 建議生成時參考的記憶與上下文引用
        decision:
          $ref: '#/components/schemas/SuggestionDecisionType'
        decidedBy:
          $ref: '#/components/schemas/UUID'
          nullable: true
          description: 做出決策的成員帳號 ID
        decidedAt:
          type: string
          format: date-time
          nullable: true
          description: 決策時間（UTC）
        modifiedParameters:
          type: object
          nullable: true
          description: 修改後的參數（decision = modify_and_accept 時有值）
        executionResult:
          type: object
          nullable: true
          description: 工具執行結果（accept / modify_and_accept 後有值）
    ai-suggestions_SuggestionGroup:
      type: object
      description: AI 建議群組完整資訊，包含所有建議的詳細內容與決策狀態
      required:
        - id
        - taskId
        - trigger
        - suggestions
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        taskId:
          $ref: '#/components/schemas/UUID'
          description: 所屬任務 ID
        trigger:
          type: string
          enum:
            - task_created
            - todo_completed
            - message_sent
            - tool_error
            - source_data_changed
            - manual_request
          description: 觸發此建議群組的事件類型
        triggerMessageId:
          $ref: '#/components/schemas/UUID'
          nullable: true
          description: 觸發事件的訊息 ID（trigger = message_sent 時有值）
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/ai-suggestions_Suggestion'
          minItems: 1
          maxItems: 5
          description: 建議列表（1~5 個建議）
        createdAt:
          type: string
          format: date-time
          description: 建議群組建立時間（UTC）
    SuggestionDecisionRequest:
      type: object
      description: 對 AI 建議做出決策的請求主體
      required:
        - decision
        - lastSeenMessageId
      properties:
        decision:
          type: string
          enum:
            - accept
            - modify_and_accept
            - reject
            - re_suggest
          description: |
            決策類型：
            - accept：直接執行建議的工具呼叫
            - modify_and_accept：修改參數後執行（需提供 modifiedParameters）
            - reject：拒絕建議（可附帶 reason）
            - re_suggest：要求 AI 重新生成建議（可附帶 reason 與 additionalInstructions）
        modifiedParameters:
          type: object
          description: 修改後的工具參數（decision = modify_and_accept 時必填）
        reason:
          type: string
          description: 拒絕或要求重新建議的原因（decision = reject / re_suggest 時可選）
        additionalInstructions:
          type: string
          description: 給 AI 的額外指示（decision = re_suggest 時可選）
        lastSeenMessageId:
          $ref: '#/components/schemas/UUID'
          description: 已讀保護：客戶端已讀的最後一則訊息 ID，確保決策者已閱讀最新對話
    SuggestionDecisionResponse:
      type: object
      description: 建議決策結果回應，採納時包含工具執行結果
      required:
        - suggestion
      properties:
        suggestion:
          type: object
          description: 決策後的建議狀態
          required:
            - id
            - summary
            - tool
            - decision
            - decidedBy
            - decidedAt
          properties:
            id:
              $ref: '#/components/schemas/UUID'
            summary:
              type: string
              description: 建議摘要
            tool:
              type: string
              description: 建議使用的工具名稱
            decision:
              type: string
              enum:
                - accept
                - modify_and_accept
                - reject
                - re_suggest
              description: 決策類型
            decidedBy:
              $ref: '#/components/schemas/UUID'
              description: 做出決策的成員帳號 ID
            decidedAt:
              type: string
              format: date-time
              description: 決策時間（UTC）
        executionResult:
          type: object
          nullable: true
          description: 工具執行結果（accept / modify_and_accept 時有值）
          properties:
            success:
              type: boolean
              description: 執行是否成功
            result:
              type: object
              description: 工具回傳的結果資料
            error:
              type: string
              nullable: true
              description: 執行錯誤訊息（success = false 時有值）
        messageId:
          $ref: '#/components/schemas/UUID'
          nullable: true
          description: 決策結果產生的對話訊息 ID
    RequestSuggestionsBody:
      type: object
      description: 手動觸發 AI 建議的請求主體
      properties:
        instructions:
          type: string
          description: 給 AI 的額外指示，描述希望 AI 協助的內容
        lastSeenMessageId:
          $ref: '#/components/schemas/UUID'
          description: 已讀保護：客戶端已讀的最後一則訊息 ID
    InboundEmailAttachment:
      type: object
      description: Inbound Email 附件
      required:
        - filename
        - contentType
        - size
        - content
      properties:
        filename:
          type: string
          description: 附件檔案名稱
        contentType:
          type: string
          description: 附件 MIME 類型
        size:
          type: integer
          description: 附件大小（bytes）
        content:
          type: string
          format: byte
          description: 附件內容（Base64 編碼）
    InboundEmailJson:
      type: object
      description: JSON 格式的 Inbound Email Webhook 請求主體，由郵件伺服器轉送
      required:
        - from
        - to
        - subject
      properties:
        from:
          type: object
          description: 寄件者資訊
          required:
            - address
          properties:
            name:
              type: string
              description: 寄件者顯示名稱
            address:
              type: string
              format: email
              description: 寄件者 Email 地址
        to:
          type: array
          items:
            type: object
            required:
              - address
            properties:
              name:
                type: string
                description: 收件者顯示名稱
              address:
                type: string
                format: email
                description: 收件者 Email 地址
          minItems: 1
          description: 收件者列表
        cc:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              address:
                type: string
                format: email
          description: 副本收件者列表
        subject:
          type: string
          description: Email 主旨
        textBody:
          type: string
          description: Email 純文字內容
        htmlBody:
          type: string
          description: Email HTML 內容
        headers:
          type: object
          description: Email 標頭鍵值對，包含 message-id、in-reply-to、references 等
          additionalProperties:
            type: string
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/InboundEmailAttachment'
          description: 附件列表
    InboundEmailMultipart:
      type: object
      description: multipart/form-data 格式的 Inbound Email Webhook 請求，適用於 SendGrid Inbound Parse 等服務
      required:
        - from
        - to
        - subject
      properties:
        from:
          type: string
          description: 寄件者（格式如 'Name <address@example.com>'）
        to:
          type: string
          description: 收件者（逗號分隔）
        cc:
          type: string
          description: 副本收件者（逗號分隔）
        subject:
          type: string
          description: Email 主旨
        text:
          type: string
          description: Email 純文字內容
        html:
          type: string
          description: Email HTML 內容
        headers:
          type: string
          description: 原始 Email 標頭（完整的標頭文字）
        envelope:
          type: string
          description: SMTP envelope JSON 字串（包含 from 與 to）
        attachments:
          type: integer
          description: 附件數量
        attachment1:
          type: string
          format: binary
          description: 第一個附件檔案（依序遞增：attachment1, attachment2, ...）
    InboundEmailResponse:
      type: object
      description: Inbound Email 處理結果回應
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - matched
            - unmatched
          description: |
            處理狀態：
            - matched：成功匹配到任務，信件已加入任務對話
            - unmatched：無法匹配，已歸入專案的未分類收件匣
        taskId:
          $ref: '#/components/schemas/UUID'
          nullable: true
          description: 匹配到的任務 ID（status = matched 時有值）
        messageId:
          $ref: '#/components/schemas/UUID'
          nullable: true
          description: 新增至任務對話的訊息 ID（status = matched 時有值）
        threadId:
          $ref: '#/components/schemas/UUID'
          nullable: true
          description: 匹配或建立的 Email Thread ID（status = matched 時有值）
        emailId:
          $ref: '#/components/schemas/UUID'
          nullable: true
          description: 未分類信件 ID（status = unmatched 時有值）
        projectId:
          $ref: '#/components/schemas/UUID'
          nullable: true
          description: 歸入的專案 ID（status = unmatched 時有值）
    UnassignedEmail:
      type: object
      description: 未分類收件匣中的信件項目，尚未匹配到任何任務
      required:
        - id
        - from
        - subject
        - receivedAt
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        from:
          type: object
          description: 寄件者資訊
          required:
            - address
          properties:
            name:
              type: string
              nullable: true
              description: 寄件者顯示名稱
            address:
              type: string
              format: email
              description: 寄件者 Email 地址
        subject:
          type: string
          description: Email 主旨
        snippet:
          type: string
          description: Email 內容預覽片段
        receivedAt:
          type: string
          format: date-time
          description: 收件時間（UTC）
        hasAttachments:
          type: boolean
          description: 是否包含附件
    webhooks_Webhook:
      type: object
      description: Webhook 設定完整回應。Secret 欄位以遮蔽形式回傳（如 'whsec_****'），不顯示明文
      required:
        - id
        - projectId
        - name
        - url
        - events
        - enabled
        - createdBy
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        projectId:
          $ref: '#/components/schemas/UUID'
          description: 所屬專案 ID
        name:
          type: string
          description: Webhook 名稱（便於識別用途）
        url:
          type: string
          format: uri
          description: 目標推送 URL（生產環境必須為 HTTPS）
        hasSecret:
          type: boolean
          description: 是否已設定 HMAC 簽名密鑰（不回傳明文）
        events:
          type: array
          items:
            type: string
          description: |
            訂閱的事件類型列表。支援的事件：
            task.created, task.updated, task.completed, task.deleted,
            todo.created, todo.completed, todo.updated,
            data_entry.created, data_entry.updated, data_entry.deleted,
            message.created, member.added, member.removed
        enabled:
          type: boolean
          description: 是否啟用
        createdBy:
          $ref: '#/components/schemas/UUID'
          description: 建立者帳號 ID
        createdAt:
          type: string
          format: date-time
          description: 建立時間（UTC）
        updatedAt:
          type: string
          format: date-time
          description: 最後更新時間（UTC）
    CreateWebhookRequest:
      type: object
      description: 建立 Webhook 設定的請求主體
      required:
        - name
        - url
        - events
      properties:
        name:
          type: string
          description: Webhook 名稱（便於識別用途）
        url:
          type: string
          format: uri
          description: 目標推送 URL（生產環境必須為 HTTPS）
        events:
          type: array
          items:
            type: string
          minItems: 1
          description: 訂閱的事件類型列表（至少一個）
        enabled:
          type: boolean
          default: true
          description: 是否啟用，預設為 true
    WebhookWithSecret:
      type: object
      description: 含完整 Secret 的 Webhook 回應，僅在建立時回傳一次。Secret 明文之後無法再次取得
      required:
        - id
        - projectId
        - name
        - url
        - events
        - enabled
        - secret
        - createdBy
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        projectId:
          $ref: '#/components/schemas/UUID'
          description: 所屬專案 ID
        name:
          type: string
          description: Webhook 名稱
        url:
          type: string
          format: uri
          description: 目標推送 URL
        events:
          type: array
          items:
            type: string
          description: 訂閱的事件類型列表
        enabled:
          type: boolean
          description: 是否啟用
        secret:
          type: string
          description: HMAC-SHA256 簽名密鑰明文（僅此一次顯示，請妥善保存）
        createdBy:
          $ref: '#/components/schemas/UUID'
          description: 建立者帳號 ID
        createdAt:
          type: string
          format: date-time
          description: 建立時間（UTC）
        updatedAt:
          type: string
          format: date-time
          description: 最後更新時間（UTC）
    UpdateWebhookRequest:
      type: object
      description: 更新 Webhook 設定的請求主體。無法透過此端點更新 secret，需刪除後重建
      properties:
        name:
          type: string
          description: Webhook 名稱
        url:
          type: string
          format: uri
          description: 目標推送 URL
        events:
          type: array
          items:
            type: string
          minItems: 1
          description: 訂閱的事件類型列表（完整替換）
        enabled:
          type: boolean
          description: 是否啟用
    WebhookTestResponse:
      type: object
      description: Webhook 測試推送結果
      required:
        - success
        - statusCode
        - responseTime
        - logId
      properties:
        success:
          type: boolean
          description: 測試推送是否成功（目標端點回應 2xx）
        statusCode:
          type: integer
          description: 目標端點的 HTTP 回應狀態碼
        responseTime:
          type: integer
          description: 回應時間（毫秒）
        responseBody:
          type: string
          nullable: true
          description: 目標端點的回應內容（截斷至 10KB）
        logId:
          $ref: '#/components/schemas/UUID'
          description: 此次測試推送的事件日誌 ID，可用於查詢詳細紀錄
        error:
          type: string
          nullable: true
          description: 錯誤訊息（連線失敗、逾時等）
    WebhookEventStatus:
      type: string
      enum:
        - pending
        - success
        - failed
      description: Webhook 推送狀態
    WebhookLog:
      type: object
      description: Webhook 事件推送紀錄，記錄每次推送的結果與重試狀態
      required:
        - id
        - webhookId
        - event
        - status
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        webhookId:
          $ref: '#/components/schemas/UUID'
          description: 所屬 Webhook ID
        event:
          type: string
          description: 事件類型（如 'task.completed'、'test'）
        payload:
          type: object
          description: 推送的 JSON 資料
        status:
          $ref: '#/components/schemas/WebhookEventStatus'
          description: 推送狀態：pending（等待/重試中）、success（成功）、failed（失敗）
        statusCode:
          type: integer
          nullable: true
          description: 目標端點的 HTTP 回應狀態碼
        responseBody:
          type: string
          nullable: true
          description: 目標端點的 HTTP 回應內容（截斷至 10KB）
        responseTime:
          type: integer
          nullable: true
          description: 回應時間（毫秒）
        attempts:
          type: integer
          description: 已嘗試推送次數
        maxAttempts:
          type: integer
          description: 最大嘗試次數
        nextRetryAt:
          type: string
          format: date-time
          nullable: true
          description: 下次重試時間（UTC）
        isTest:
          type: boolean
          description: 是否為測試事件
        createdAt:
          type: string
          format: date-time
          description: 建立時間（UTC）
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: 最終完成時間（成功或放棄重試）
    ChannelConfig:
      type: object
      description: 通知頻道設定
      properties:
        enabled:
          type: boolean
        categories:
          type: object
          properties:
            taskUpdates:
              type: boolean
            todoAssignments:
              type: boolean
            aiSuggestions:
              type: boolean
            mentions:
              type: boolean
            systemAnnouncements:
              type: boolean
    entities_NotificationPreferences:
      type: object
      description: 通知偏好設定
      properties:
        channels:
          type: object
          properties:
