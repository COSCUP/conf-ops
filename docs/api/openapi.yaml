openapi: 3.1.0
info:
  title: Conf-Ops API
  version: 1.0.0
  description: |
    Conf-Ops — AI 輔助的研討會/活動專案管理系統 API。

    內部 API 端點使用 `/api/v1/` 前綴，外部資料 API 使用 `/external/v1/` 前綴。
    認證使用 JWT Bearer Token（透過 Passkey 或 Magic Link 取得）。
    外部資料 API 使用專案層級 API Key 認證。

    ## 分頁
    使用 cursor-based 分頁，回傳 opaque cursor token。

    ## 錯誤處理
    遵循 RFC 7807 Problem Details 格式。

    ## 即時通訊
    任務對話支援 WebSocket 連線（CRDT 同步 + 即時更新 + 通知推送）。

  contact:
    name: Conf-Ops Team
  license:
    name: MIT

servers:
  - url: /api/v1
    description: API v1 主要端點（內部 API，JWT 認證）
  - url: /external/v1
    description: 外部資料 API 端點（API Key 認證）

tags:
  - name: Auth
    description: 認證 — Passkey (WebAuthn) + Email Magic Link
  - name: Accounts
    description: 帳號管理 — 個人資料、偏好設定、個人資料表
  - name: Organizations
    description: 組織管理 — 成員、聯絡人、工具設定
  - name: Projects
    description: 專案管理 — 建立、複製、權限設定
  - name: Members
    description: 專案成員管理 — 邀請、角色、標籤指派
  - name: Contacts
    description: 外部聯絡人管理 — 建立、合併、標籤指派
  - name: MemberTags
    description: 成員標籤管理 — 角色/組別定義、外部建立任務設定
  - name: TaskTemplates
    description: 任務模板管理 — 待辦模板、資料表定義、資料表聚合
  - name: Tasks
    description: 任務管理 — 建立、狀態轉換、參與人
  - name: Conversations
    description: 任務對話 — 訊息、CRDT 同步、WebSocket、附件
  - name: Todos
    description: 待辦事項管理 — 建立、指派、關聯任務、狀態更新
  - name: DataSheets
    description: 資料表 — 資料列新增/修改、跨任務聚合、資料分享
  - name: ExternalData
    description: 外部資料 API — 專案層級 API Key 認證（讀取與寫入）
  - name: ApiKeys
    description: API Key 管理 — 產生、列出、撤銷專案層級 API Key
  - name: AuditLogs
    description: 審計日誌 — 組織與專案層級操作記錄查詢
  - name: Tools
    description: 執行工具 — MCP 工具執行、工具設定管理
  - name: ToolConfigs
    description: 工具設定管理
  - name: Memories
    description: 記憶系統 — 記憶 CRUD、記憶庫文件、繼承鏈查詢
  - name: Notifications
    description: 通知系統 — 通知列表、已讀標記、偏好設定、Web Push 訂閱
  - name: AISuggestions
    description: AI 建議 — SuggestionGroup 生命週期、決策操作
  - name: Email
    description: 電子郵件整合 — 收信 webhook、未分類收件匣
  - name: EmailInbound
    description: 電子郵件接收 — HTTP webhook 收信處理（AWS SES Lambda / Cloudflare Email Worker）
  - name: LibraryDocuments
    description: 記憶庫文件 — 文件 CRUD、版本歷史
  - name: Webhooks
    description: Webhook — 設定管理、事件日誌、外部系統整合
  - name: Files
    description: 檔案儲存 — 上傳、下載、刪除檔案
  - name: Operations
    description: 運維端點 — 健康檢查、就緒探測、Prometheus 指標

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token，透過 Passkey 或 Magic Link 認證後取得。
        有效期 15 分鐘，過期後使用 refresh token 更新。
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        專案層級 API Key，用於外部資料 API 的存取。

  schemas:
    # ── 共用 Schema ──
    CursorPaginationParams:
      $ref: './schemas/common.yaml#/CursorPaginationParams'
    CursorPaginationMeta:
      $ref: './schemas/common.yaml#/CursorPaginationMeta'
    ProblemDetails:
      $ref: './schemas/common.yaml#/ProblemDetails'
    ValidationError:
      $ref: './schemas/common.yaml#/ValidationError'
    Timestamps:
      $ref: './schemas/common.yaml#/Timestamps'

    # ── Entity Schema ──
    Account:
      $ref: './schemas/entities.yaml#/Account'
    Organization:
      $ref: './schemas/entities.yaml#/Organization'
    OrganizationMember:
      $ref: './schemas/entities.yaml#/OrganizationMember'
    Project:
      $ref: './schemas/entities.yaml#/Project'
    Member:
      $ref: './schemas/entities.yaml#/Member'
    Contact:
      $ref: './schemas/entities.yaml#/Contact'
    MemberTag:
      $ref: './schemas/entities.yaml#/MemberTag'
    TaskTemplate:
      $ref: './schemas/entities.yaml#/TaskTemplate'
    TodoTemplate:
      $ref: './schemas/entities.yaml#/TodoTemplate'
    DataSchema:
      $ref: './schemas/entities.yaml#/DataSchema'
    Task:
      $ref: './schemas/entities.yaml#/Task'
    Message:
      $ref: './schemas/entities.yaml#/Message'
    SuggestionGroup:
      $ref: './schemas/entities.yaml#/SuggestionGroup'
    Suggestion:
      $ref: './schemas/entities.yaml#/Suggestion'
    Todo:
      $ref: './schemas/entities.yaml#/Todo'
    DataEntry:
      $ref: './schemas/entities.yaml#/DataEntry'
    ToolConfig:
      $ref: './schemas/entities.yaml#/ToolConfig'
    Memory:
      $ref: './schemas/entities.yaml#/Memory'
    LibraryDocument:
      $ref: './schemas/entities.yaml#/LibraryDocument'
    AuditLog:
      $ref: './schemas/entities.yaml#/AuditLog'
    Notification:
      $ref: './schemas/entities.yaml#/Notification'
    Reminder:
      $ref: './schemas/entities.yaml#/Reminder'
    EmailThread:
      $ref: './schemas/entities.yaml#/EmailThread'
    Webhook:
      $ref: './schemas/entities.yaml#/Webhook'
    WebhookEventLog:
      $ref: './schemas/entities.yaml#/WebhookEventLog'

    # ── Request Schema ──
    CreateAccount:
      $ref: './schemas/requests.yaml#/CreateAccount'
    UpdateAccount:
      $ref: './schemas/requests.yaml#/UpdateAccount'
    CreateOrganization:
      $ref: './schemas/requests.yaml#/CreateOrganization'
    UpdateOrganization:
      $ref: './schemas/requests.yaml#/UpdateOrganization'
    CreateProject:
      $ref: './schemas/requests.yaml#/CreateProject'
    UpdateProject:
      $ref: './schemas/requests.yaml#/UpdateProject'
    CopyProject:
      $ref: './schemas/requests.yaml#/CopyProject'
    CreateTask:
      $ref: './schemas/requests.yaml#/CreateTask'
    SendMessage:
      $ref: './schemas/requests.yaml#/SendMessage'
    SuggestionDecision:
      $ref: './schemas/requests.yaml#/SuggestionDecision'

    # ── Response Schema ──
    ListResponse:
      $ref: './schemas/responses.yaml#/ListResponse'
    TokenPairResponse:
      $ref: './schemas/responses.yaml#/TokenPairResponse'
    HealthResponse:
      $ref: './schemas/responses.yaml#/HealthResponse'

security:
  - bearerAuth: []

