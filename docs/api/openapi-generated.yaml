components:
  schemas:
    AccountResponse:
      properties:
        avatarUrl:
          type:
          - string
          - 'null'
        bio:
          type:
          - string
          - 'null'
        createdAt:
          type: string
        email:
          type: string
        id:
          format: uuid
          type: string
        locale:
          type: string
        name:
          type: string
        updatedAt:
          type: string
      required:
      - id
      - email
      - name
      - locale
      - createdAt
      - updatedAt
      type: object
    AuthTokenResponse:
      properties:
        accessToken:
          type: string
        expiresIn:
          format: int64
          type: integer
        tokenType:
          type: string
      required:
      - accessToken
      - tokenType
      - expiresIn
      type: object
    BTreeMap:
      additionalProperties:
        type: boolean
      propertyNames:
        type: string
      type: object
    ChannelPreference:
      properties:
        categories:
          $ref: '#/components/schemas/BTreeMap'
        enabled:
          type: boolean
      required:
      - enabled
      - categories
      type: object
    HealthResponse:
      properties:
        status:
          type: string
      required:
      - status
      type: object
    MagicLinkRequest:
      properties:
        email:
          type: string
      required:
      - email
      type: object
    MagicLinkResponse:
      properties:
        message:
          type: string
      required:
      - message
      type: object
    NotificationChannels:
      properties:
        email:
          $ref: '#/components/schemas/ChannelPreference'
        inApp:
          $ref: '#/components/schemas/ChannelPreference'
        webPush:
          $ref: '#/components/schemas/ChannelPreference'
      required:
      - email
      - webPush
      - inApp
      type: object
    NotificationPreferencesResponse:
      properties:
        channels:
          $ref: '#/components/schemas/NotificationChannels'
      required:
      - channels
      type: object
    PasskeyListResponse:
      properties:
        passkeys:
          items:
            $ref: '#/components/schemas/PasskeyResponse'
          type: array
      required:
      - passkeys
      type: object
    PasskeyLoginBeginResponse:
      allOf:
      - type: object
      - properties:
          challenge_id:
            format: uuid
            type: string
        required:
        - challenge_id
        type: object
    PasskeyLoginCompleteRequest:
      properties:
        challenge_id:
          format: uuid
          type: string
        credential:
          type: object
      required:
      - challenge_id
      - credential
      type: object
    PasskeyRegisterCompleteRequest:
      properties:
        credential:
          type: object
        name:
          type: string
      required:
      - credential
      type: object
    PasskeyResponse:
      properties:
        createdAt:
          type: string
        id:
          format: uuid
          type: string
        lastUsedAt:
          type:
          - string
          - 'null'
        name:
          type: string
      required:
      - id
      - name
      - createdAt
      type: object
    ProblemDetails:
      description: RFC 7807 Problem Details error response.
      properties:
        detail:
          description: Detailed error description.
          type:
          - string
          - 'null'
        errors:
          description: Field-level validation errors.
          items:
            $ref: '#/components/schemas/ValidationError'
          type:
          - array
          - 'null'
        instance:
          description: URI of the specific resource where the error occurred.
          type:
          - string
          - 'null'
        status:
          description: HTTP status code.
          format: int32
          minimum: 0
          type: integer
        title:
          description: Human-readable error summary.
          type: string
        type:
          description: Error type URI for programmatic identification.
          type: string
      required:
      - type
      - title
      - status
      type: object
    ProfileResponse:
      properties:
        profileData:
          type: object
        profileSchema:
          type: object
      required:
      - profileData
      - profileSchema
      type: object
    ReadyChecks:
      properties:
        database:
          type: string
      required:
      - database
      type: object
    ReadyResponse:
      properties:
        checks:
          $ref: '#/components/schemas/ReadyChecks'
        status:
          type: string
      required:
      - status
      - checks
      type: object
    UpdateAccountRequest:
      properties:
        avatarUrl:
          type:
          - string
          - 'null'
        bio:
          type:
          - string
          - 'null'
        locale:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
      type: object
    UpdateNotificationPreferencesRequest:
      properties:
        channels:
          $ref: '#/components/schemas/NotificationChannels'
      required:
      - channels
      type: object
    UpdateProfileRequest:
      properties:
        profileData:
          type: object
        profileSchema:
          type:
          - object
          - 'null'
      required:
      - profileData
      type: object
    ValidationError:
      description: A single field validation error.
      properties:
        code:
          description: Error code for programmatic handling (e.g. "required", "`too_long`").
          type: string
        field:
          description: Field path (e.g. "name", "config.apiKey").
          type: string
        message:
          description: Human-readable error message.
          type: string
      required:
      - field
      - message
      - code
      type: object
  securitySchemes:
    bearer_auth:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  description: AI-assisted conference/event project management system
  license:
    name: ''
  title: Conf-Ops API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/accounts/me:
    get:
      description: |-
        # Errors

        Returns `ProblemDetails` if account not found.
      operationId: get_me
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
          description: Current user account
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unauthorized
      security:
      - bearer_auth: []
      summary: Get the current authenticated user's account.
      tags:
      - accounts
    patch:
      description: |-
        # Errors

        Returns `ProblemDetails` on failure.
      operationId: update_me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
          description: Account updated
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unauthorized
      security:
      - bearer_auth: []
      summary: Update the current user's account.
      tags:
      - accounts
  /api/v1/accounts/me/notification-preferences:
    get:
      description: |-
        # Errors

        Returns `ProblemDetails` on failure.
      operationId: get_notification_preferences
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesResponse'
          description: Notification preferences
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unauthorized
      security:
      - bearer_auth: []
      summary: Get notification preferences.
      tags:
      - accounts
    put:
      description: |-
        # Errors

        Returns `ProblemDetails` on failure.
      operationId: update_notification_preferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationPreferencesRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesResponse'
          description: Notification preferences updated
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unauthorized
      security:
      - bearer_auth: []
      summary: Update notification preferences.
      tags:
      - accounts
  /api/v1/accounts/me/profile:
    get:
      description: |-
        # Errors

        Returns `ProblemDetails` if account not found.
      operationId: get_profile
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
          description: User profile data
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unauthorized
      security:
      - bearer_auth: []
      summary: Get the current user's profile data.
      tags:
      - accounts
    put:
      description: |-
        # Errors

        Returns `ProblemDetails` on failure.
      operationId: update_profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
          description: Profile updated
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unauthorized
      security:
      - bearer_auth: []
      summary: Update the current user's profile data.
      tags:
      - accounts
  /api/v1/auth/logout:
    post:
      description: |-
        # Errors

        Returns `ProblemDetails` on database failure.
      operationId: logout
      responses:
        '204':
          description: Logged out successfully
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unauthorized
      security:
      - bearer_auth: []
      summary: 'Logout: revoke all refresh tokens and clear cookie.'
      tags:
      - auth
  /api/v1/auth/magic-link/request:
    post:
      description: |-
        # Errors

        Returns `ProblemDetails` on failure.
      operationId: request_magic_link
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MagicLinkResponse'
          description: Magic link email sent
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Invalid request
      summary: Request a magic link email.
      tags:
      - auth
  /api/v1/auth/magic-link/verify:
    get:
      description: |-
        # Errors

        Returns `ProblemDetails` on invalid or expired token.
      operationId: verify_magic_link
      parameters:
      - description: Magic link token
        in: query
        name: token
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
          description: Authentication successful
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Invalid or expired token
      summary: Verify a magic link token and return access/refresh tokens.
      tags:
      - auth
  /api/v1/auth/passkey/login/begin:
    post:
      description: |-
        # Errors

        Returns `ProblemDetails` on `WebAuthn` failure.
      operationId: passkey_login_begin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyLoginBeginResponse'
          description: Login challenge created
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Internal error
      summary: Begin passkey login (public, no auth required).
      tags:
      - auth
  /api/v1/auth/passkey/login/complete:
    post:
      description: |-
        # Errors

        Returns `ProblemDetails` on `WebAuthn` verification or credential failure.
      operationId: passkey_login_complete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyLoginCompleteRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
          description: Login successful
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Invalid credentials
      summary: Complete passkey login and return tokens.
      tags:
      - auth
  /api/v1/auth/passkey/register/begin:
    post:
      description: |-
        # Errors

        Returns `ProblemDetails` on `WebAuthn` or database failure.
      operationId: passkey_register_begin
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: Registration challenge created
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unauthorized
      security:
      - bearer_auth: []
      summary: Begin passkey registration (requires authentication).
      tags:
      - auth
  /api/v1/auth/passkey/register/complete:
    post:
      description: |-
        # Errors

        Returns `ProblemDetails` on `WebAuthn` verification failure.
      operationId: passkey_register_complete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyRegisterCompleteRequest'
        required: true
      responses:
        '201':
          description: Passkey registered
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unauthorized
      security:
      - bearer_auth: []
      summary: Complete passkey registration.
      tags:
      - auth
  /api/v1/auth/passkeys:
    get:
      description: |-
        # Errors

        Returns `ProblemDetails` on failure.
      operationId: list_passkeys
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyListResponse'
          description: List of passkeys
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unauthorized
      security:
      - bearer_auth: []
      summary: List the current user's passkeys.
      tags:
      - auth
  /api/v1/auth/passkeys/{id}:
    delete:
      description: |-
        # Errors

        Returns `ProblemDetails` if credential not found.
      operationId: delete_passkey
      parameters:
      - description: Passkey credential ID
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: Passkey deleted
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Passkey not found
      security:
      - bearer_auth: []
      summary: Delete a passkey credential.
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      description: |-
        # Errors

        Returns `ProblemDetails` if no refresh token cookie or token is invalid.
      operationId: refresh
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
          description: Tokens refreshed
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Invalid refresh token
      summary: Rotate the refresh token and return new tokens.
      tags:
      - auth
  /healthz:
    get:
      operationId: healthz
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Service is healthy
      tags:
      - health
  /readyz:
    get:
      operationId: readyz
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
          description: Service is ready
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
          description: Service is not ready
      tags:
      - health
tags:
- description: Health check endpoints
  name: health
- description: Authentication endpoints
  name: auth
- description: Account management endpoints
  name: accounts
