components:
  schemas:
    AccountResponse:
      properties:
        avatarUrl:
          type:
          - string
          - 'null'
        bio:
          type:
          - string
          - 'null'
        createdAt:
          type: string
        email:
          type: string
        id:
          format: uuid
          type: string
        locale:
          type: string
        name:
          type: string
        updatedAt:
          type: string
      required:
      - id
      - email
      - name
      - locale
      - createdAt
      - updatedAt
      type: object
    AuthTokenResponse:
      properties:
        accessToken:
          type: string
        expiresIn:
          format: int64
          type: integer
        tokenType:
          type: string
      required:
      - accessToken
      - tokenType
      - expiresIn
      type: object
    BTreeMap:
      additionalProperties:
        type: boolean
      propertyNames:
        type: string
      type: object
    ChannelPreference:
      properties:
        categories:
          $ref: '#/components/schemas/BTreeMap'
        enabled:
          type: boolean
      required:
      - enabled
      - categories
      type: object
    CopyProjectRequest:
      properties:
        description:
          type:
          - string
          - 'null'
        name:
          type: string
        sourceProjectId:
          format: uuid
          type: string
      required:
      - sourceProjectId
      - name
      type: object
    CreateOrganizationRequest:
      properties:
        description:
          type:
          - string
          - 'null'
        logoUrl:
          type:
          - string
          - 'null'
        name:
          type: string
      required:
      - name
      type: object
    CreateProjectRequest:
      properties:
        description:
          type:
          - string
          - 'null'
        name:
          type: string
      required:
      - name
      type: object
    HealthResponse:
      properties:
        status:
          type: string
      required:
      - status
      type: object
    InviteMemberRequest:
      properties:
        email:
          type: string
        role:
          $ref: '#/components/schemas/OrgRole'
      required:
      - email
      - role
      type: object
    InviteMemberResponse:
      properties:
        memberId:
          format: uuid
          type: string
      required:
      - memberId
      type: object
    MagicLinkRequest:
      properties:
        email:
          type: string
      required:
      - email
      type: object
    MagicLinkResponse:
      properties:
        message:
          type: string
      required:
      - message
      type: object
    NotificationChannels:
      properties:
        email:
          $ref: '#/components/schemas/ChannelPreference'
        inApp:
          $ref: '#/components/schemas/ChannelPreference'
        webPush:
          $ref: '#/components/schemas/ChannelPreference'
      required:
      - email
      - webPush
      - inApp
      type: object
    NotificationPreferencesResponse:
      properties:
        channels:
          $ref: '#/components/schemas/NotificationChannels'
      required:
      - channels
      type: object
    OrgMemberListResponse:
      properties:
        members:
          items:
            $ref: '#/components/schemas/OrgMemberResponse'
          type: array
      required:
      - members
      type: object
    OrgMemberResponse:
      properties:
        accountId:
          format: uuid
          type: string
        avatarUrl:
          type:
          - string
          - 'null'
        createdAt:
          type: string
        email:
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/OrgRole'
      required:
      - id
      - accountId
      - role
      - name
      - email
      - createdAt
      type: object
    OrgRole:
      enum:
      - org_owner
      - org_admin
      - org_member
      type: string
    OrganizationListItem:
      properties:
        createdAt:
          type: string
        description:
          type:
          - string
          - 'null'
        id:
          format: uuid
          type: string
        logoUrl:
          type:
          - string
          - 'null'
        name:
          type: string
        role:
          $ref: '#/components/schemas/OrgRole'
      required:
      - id
      - name
      - createdAt
      - role
      type: object
    OrganizationListResponse:
      properties:
        organizations:
          items:
            $ref: '#/components/schemas/OrganizationListItem'
          type: array
      required:
      - organizations
      type: object
    OrganizationResponse:
      properties:
        createdAt:
          type: string
        createdBy:
          format: uuid
          type: string
        description:
          type:
          - string
          - 'null'
        id:
          format: uuid
          type: string
        logoUrl:
          type:
          - string
          - 'null'
        name:
          type: string
        updatedAt:
          type: string
      required:
      - id
      - name
      - createdBy
      - createdAt
      - updatedAt
      type: object
    PasskeyListResponse:
      properties:
        passkeys:
          items:
            $ref: '#/components/schemas/PasskeyResponse'
          type: array
      required:
      - passkeys
      type: object
    PasskeyLoginBeginResponse:
      allOf:
      - type: object
      - properties:
          challenge_id:
            format: uuid
            type: string
        required:
        - challenge_id
        type: object
    PasskeyLoginCompleteRequest:
      properties:
        challenge_id:
          format: uuid
          type: string
        credential:
          type: object
      required:
      - challenge_id
      - credential
      type: object
    PasskeyRegisterCompleteRequest:
      properties:
        credential:
          type: object
        name:
          type: string
      required:
      - credential
      type: object
    PasskeyResponse:
      properties:
        createdAt:
          type: string
        id:
          format: uuid
          type: string
        lastUsedAt:
          type:
          - string
          - 'null'
        name:
          type: string
      required:
      - id
      - name
      - createdAt
      type: object
    PermissionSettingsResponse:
      properties:
        settings:
          type: object
      required:
      - settings
      type: object
    ProblemDetails:
      description: RFC 7807 Problem Details error response.
      properties:
        detail:
          description: Detailed error description.
          type:
          - string
          - 'null'
        errors:
          description: Field-level validation errors.
          items:
            $ref: '#/components/schemas/ValidationError'
          type:
          - array
          - 'null'
        instance:
          description: URI of the specific resource where the error occurred.
          type:
          - string
          - 'null'
        status:
          description: HTTP status code.
          format: int32
          minimum: 0
          type: integer
        title:
          description: Human-readable error summary.
          type: string
        type:
          description: Error type URI for programmatic identification.
          type: string
      required:
      - type
      - title
      - status
      type: object
    ProfileResponse:
      properties:
        profileData:
          type: object
        profileSchema:
          type: object
      required:
      - profileData
      - profileSchema
      type: object
    ProjectListItemResponse:
      properties:
        createdAt:
          type: string
        description:
          type:
          - string
          - 'null'
        id:
          format: uuid
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/ProjectStatus'
        updatedAt:
          type: string
      required:
      - id
      - name
      - status
      - createdAt
      - updatedAt
      type: object
    ProjectListResponse:
      properties:
        projects:
          items:
            $ref: '#/components/schemas/ProjectListItemResponse'
          type: array
      required:
      - projects
      type: object
    ProjectResponse:
      properties:
        createdAt:
          type: string
        createdBy:
          format: uuid
          type: string
        description:
          type:
          - string
          - 'null'
        id:
          format: uuid
          type: string
        name:
          type: string
        organizationId:
          format: uuid
          type: string
        sourceProjectId:
          format: uuid
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/ProjectStatus'
        updatedAt:
          type: string
      required:
      - id
      - organizationId
      - name
      - status
      - createdBy
      - createdAt
      - updatedAt
      type: object
    ProjectStatus:
      enum:
      - preparing
      - active
      - completed
      - archived
      type: string
    ReadyChecks:
      properties:
        database:
          type: string
      required:
      - database
      type: object
    ReadyResponse:
      properties:
        checks:
          $ref: '#/components/schemas/ReadyChecks'
        status:
          type: string
      required:
      - status
      - checks
      type: object
    UpdateAccountRequest:
      properties:
        avatarUrl:
          type:
          - string
          - 'null'
        bio:
          type:
          - string
          - 'null'
        locale:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
      type: object
    UpdateNotificationPreferencesRequest:
      properties:
        channels:
          $ref: '#/components/schemas/NotificationChannels'
      required:
      - channels
      type: object
    UpdateOrgMemberRequest:
      properties:
        role:
          $ref: '#/components/schemas/OrgRole'
      required:
      - role
      type: object
    UpdateOrganizationRequest:
      properties:
        description:
          type:
          - string
          - 'null'
        logoUrl:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
      type: object
    UpdatePermissionSettingsRequest:
      properties:
        settings:
          type: object
      required:
      - settings
      type: object
    UpdateProfileRequest:
      properties:
        profileData:
          type: object
        profileSchema:
          type:
          - object
          - 'null'
      required:
      - profileData
      type: object
    UpdateProjectRequest:
      properties:
        description:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
      type: object
    UpdateProjectStatusRequest:
      properties:
        status:
          $ref: '#/components/schemas/ProjectStatus'
      required:
      - status
      type: object
    ValidationError:
      description: A single field validation error.
      properties:
        code:
          description: Error code for programmatic handling (e.g. "required", "`too_long`").
          type: string
        field:
          description: Field path (e.g. "name", "config.apiKey").
          type: string
        message:
          description: Human-readable error message.
          type: string
      required:
      - field
      - message
      - code
      type: object
  securitySchemes:
    bearer_auth:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  description: AI-assisted conference/event project management system
  license:
    name: ''
  title: Conf-Ops API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/accounts/me:
    get:
      description: |-
        # Errors

        Returns `ProblemDetails` if account not found.
      operationId: get_me
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
          description: Current user account
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unauthorized
      security:
      - bearer_auth: []
      summary: Get the current authenticated user's account.
      tags:
      - accounts
    patch:
      description: |-
        # Errors

        Returns `ProblemDetails` on failure.
      operationId: update_me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
          description: Account updated
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unauthorized
      security:
      - bearer_auth: []
      summary: Update the current user's account.
      tags:
      - accounts
  /api/v1/accounts/me/notification-preferences:
    get:
      description: |-
        # Errors

        Returns `ProblemDetails` on failure.
      operationId: get_notification_preferences
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesResponse'
          description: Notification preferences
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unauthorized
      security:
      - bearer_auth: []
      summary: Get notification preferences.
      tags:
      - accounts
    put:
      description: |-
        # Errors

        Returns `ProblemDetails` on failure.
      operationId: update_notification_preferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationPreferencesRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesResponse'
          description: Notification preferences updated
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unauthorized
      security:
      - bearer_auth: []
      summary: Update notification preferences.
      tags:
      - accounts
  /api/v1/accounts/me/profile:
    get:
      description: |-
        # Errors

        Returns `ProblemDetails` if account not found.
      operationId: get_profile
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
          description: User profile data
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unauthorized
      security:
      - bearer_auth: []
      summary: Get the current user's profile data.
      tags:
      - accounts
    put:
      description: |-
        # Errors

        Returns `ProblemDetails` on failure.
      operationId: update_profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
          description: Profile updated
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unauthorized
      security:
      - bearer_auth: []
      summary: Update the current user's profile data.
      tags:
      - accounts
  /api/v1/auth/logout:
    post:
      description: |-
        # Errors

        Returns `ProblemDetails` on database failure.
      operationId: logout
      responses:
        '204':
          description: Logged out successfully
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unauthorized
      security:
      - bearer_auth: []
      summary: 'Logout: revoke all refresh tokens and clear cookie.'
      tags:
      - auth
  /api/v1/auth/magic-link/request:
    post:
      description: |-
        # Errors

        Returns `ProblemDetails` on failure.
      operationId: request_magic_link
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MagicLinkResponse'
          description: Magic link email sent
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Invalid request
      summary: Request a magic link email.
      tags:
      - auth
  /api/v1/auth/magic-link/verify:
    get:
      description: |-
        # Errors

        Returns `ProblemDetails` on invalid or expired token.
      operationId: verify_magic_link
      parameters:
      - description: Magic link token
        in: query
        name: token
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
          description: Authentication successful
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Invalid or expired token
      summary: Verify a magic link token and return access/refresh tokens.
      tags:
      - auth
  /api/v1/auth/passkey/login/begin:
    post:
      description: |-
        # Errors

        Returns `ProblemDetails` on `WebAuthn` failure.
      operationId: passkey_login_begin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyLoginBeginResponse'
          description: Login challenge created
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Internal error
      summary: Begin passkey login (public, no auth required).
      tags:
      - auth
  /api/v1/auth/passkey/login/complete:
    post:
      description: |-
        # Errors

        Returns `ProblemDetails` on `WebAuthn` verification or credential failure.
      operationId: passkey_login_complete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyLoginCompleteRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
          description: Login successful
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Invalid credentials
      summary: Complete passkey login and return tokens.
      tags:
      - auth
  /api/v1/auth/passkey/register/begin:
    post:
      description: |-
        # Errors

        Returns `ProblemDetails` on `WebAuthn` or database failure.
      operationId: passkey_register_begin
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: Registration challenge created
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unauthorized
      security:
      - bearer_auth: []
      summary: Begin passkey registration (requires authentication).
      tags:
      - auth
  /api/v1/auth/passkey/register/complete:
    post:
      description: |-
        # Errors

        Returns `ProblemDetails` on `WebAuthn` verification failure.
      operationId: passkey_register_complete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyRegisterCompleteRequest'
        required: true
      responses:
        '201':
          description: Passkey registered
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unauthorized
      security:
      - bearer_auth: []
      summary: Complete passkey registration.
      tags:
      - auth
  /api/v1/auth/passkeys:
    get:
      description: |-
        # Errors

        Returns `ProblemDetails` on failure.
      operationId: list_passkeys
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyListResponse'
          description: List of passkeys
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unauthorized
      security:
      - bearer_auth: []
      summary: List the current user's passkeys.
      tags:
      - auth
  /api/v1/auth/passkeys/{id}:
    delete:
      description: |-
        # Errors

        Returns `ProblemDetails` if credential not found.
      operationId: delete_passkey
      parameters:
      - description: Passkey credential ID
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: Passkey deleted
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Passkey not found
      security:
      - bearer_auth: []
      summary: Delete a passkey credential.
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      description: |-
        # Errors

        Returns `ProblemDetails` if no refresh token cookie or token is invalid.
      operationId: refresh
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
          description: Tokens refreshed
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Invalid refresh token
      summary: Rotate the refresh token and return new tokens.
      tags:
      - auth
  /api/v1/organizations:
    get:
      description: |-
        # Errors

        Returns `ProblemDetails` on failure.
      operationId: list_organizations
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationListResponse'
          description: List of user's organizations
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unauthorized
      security:
      - bearer_auth: []
      summary: List organizations the current user belongs to.
      tags:
      - organizations
    post:
      description: |-
        # Errors

        Returns `ProblemDetails` on failure.
      operationId: create_organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
          description: Organization created
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unauthorized
      security:
      - bearer_auth: []
      summary: Create a new organization.
      tags:
      - organizations
  /api/v1/organizations/{orgId}:
    delete:
      description: |-
        # Errors

        Returns `ProblemDetails` on failure.
      operationId: delete_organization
      parameters:
      - description: Organization ID
        in: path
        name: orgId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: Organization deleted
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Forbidden
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Has active projects
      security:
      - bearer_auth: []
      summary: Delete an organization (soft delete).
      tags:
      - organizations
    get:
      description: |-
        # Errors

        Returns `ProblemDetails` on failure.
      operationId: get_organization
      parameters:
      - description: Organization ID
        in: path
        name: orgId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
          description: Organization details
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Not found
      security:
      - bearer_auth: []
      summary: Get organization details by ID.
      tags:
      - organizations
    put:
      description: |-
        # Errors

        Returns `ProblemDetails` on failure.
      operationId: update_organization
      parameters:
      - description: Organization ID
        in: path
        name: orgId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
          description: Organization updated
        '401':
          content:
            application/json:
              schema:
