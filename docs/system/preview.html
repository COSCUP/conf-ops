<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conf-Ops 系統架構文件</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<style>
  :root { --bg: #fff; --fg: #24292e; --border: #e1e4e8; --code-bg: #f6f8fa; --link: #0366d6; --nav-bg: #f6f8fa; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: var(--fg); background: var(--bg); display: flex; min-height: 100vh; }
  nav { width: 280px; min-width: 280px; background: var(--nav-bg); border-right: 1px solid var(--border); padding: 20px; overflow-y: auto; position: sticky; top: 0; height: 100vh; }
  nav h2 { font-size: 16px; margin-bottom: 16px; }
  nav a { display: block; padding: 6px 8px; color: var(--link); text-decoration: none; font-size: 14px; border-radius: 4px; margin-bottom: 2px; }
  nav a:hover, nav a.active { background: #e1e4e8; }
  main { flex: 1; max-width: 900px; padding: 40px; }
  main h1 { font-size: 28px; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 16px; }
  main h2 { font-size: 22px; margin-top: 24px; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  main h3 { font-size: 18px; margin-top: 20px; margin-bottom: 8px; }
  main p { margin-bottom: 12px; line-height: 1.7; }
  main ul, main ol { margin-bottom: 12px; padding-left: 2em; }
  main li { margin-bottom: 4px; line-height: 1.6; }
  main table { border-collapse: collapse; margin-bottom: 16px; width: 100%; }
  main th, main td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
  main th { background: var(--code-bg); }
  main code { background: var(--code-bg); padding: 2px 6px; border-radius: 3px; font-size: 90%; }
  main pre { background: var(--code-bg); padding: 16px; border-radius: 6px; overflow-x: auto; margin-bottom: 16px; }
  main pre code { background: none; padding: 0; }
  main blockquote { border-left: 4px solid var(--border); padding-left: 16px; color: #6a737d; margin-bottom: 12px; }
  main hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
  .mermaid { text-align: center; margin: 16px 0; }
  main img { max-width: 100%; }
</style>
</head>
<body>
<nav>
  <h2>系統架構文件</h2>
  <div id="nav-links"></div>
</nav>
<main id="content">
  <p>載入中...</p>
</main>

<script>
const files = [
  { name: 'README.md', label: '總覽' },
  { name: '01-service-decomposition.md', label: '01 服務拆分' },
  { name: '02-deployment-architecture.md', label: '02 部署架構' },
  { name: '03-crdt-implementation.md', label: '03 CRDT 實作' },
  { name: '04-ai-pipeline.md', label: '04 AI 管線' },
  { name: '05-privacy-engine.md', label: '05 隱私引擎' },
  { name: '06-email-integration.md', label: '06 Email 整合' },
  { name: '07-mcp-tool-runtime.md', label: '07 MCP 工具' },
  { name: '08-authentication.md', label: '08 認證' },
  { name: '09-authorization.md', label: '09 授權' },
  { name: '10-notification-system.md', label: '10 通知系統' },
  { name: '11-file-storage.md', label: '11 檔案儲存' },
  { name: '12-observability.md', label: '12 可觀測性' },
];

mermaid.initialize({ startOnLoad: false, theme: 'default', suppressErrors: true, securityLevel: 'loose' });

const renderer = new marked.Renderer();
renderer.code = function({ text, lang }) {
  if (lang === 'mermaid') {
    return '<div class="mermaid">' + text + '</div>';
  }
  const escaped = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return '<pre><code class="language-' + (lang||'') + '">' + escaped + '</code></pre>';
};
marked.setOptions({ renderer });

const navEl = document.getElementById('nav-links');
const contentEl = document.getElementById('content');

files.forEach(f => {
  const a = document.createElement('a');
  a.href = '#';
  a.textContent = f.label;
  a.dataset.file = f.name;
  a.addEventListener('click', e => { e.preventDefault(); loadFile(f.name); });
  navEl.appendChild(a);
});

async function loadFile(name) {
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('active', a.dataset.file === name));
  try {
    const resp = await fetch(name);
    if (!resp.ok) throw new Error(resp.statusText);
    const md = await resp.text();
    contentEl.innerHTML = marked.parse(md);
    const mermaidNodes = contentEl.querySelectorAll('.mermaid');
    if (mermaidNodes.length > 0) {
      try {
        await mermaid.run({ nodes: mermaidNodes });
      } catch(mErr) {
        console.warn('Mermaid rendering error:', mErr);
      }
    }
  } catch(e) {
    contentEl.innerHTML = '<p style="color:red">載入失敗: ' + e.message + '</p>';
  }
  window.scrollTo(0, 0);
}

loadFile('README.md');
</script>
</body>
</html>
